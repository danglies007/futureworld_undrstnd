# tasks.yaml - futurist_research_crew
# This is the version before the following changes were made:

# Key Changes after this Version:

# Explicit Workflow: Defined a numbered MANDATORY WORKFLOW PER URL to force the agent into a scrape -> analyze -> accumulate cycle for each URL.
# Isolate Analysis (Step 3): Emphasized that after scraping, the immediate and only next step is to analyze that specific observation to extract forces. It explicitly tells the agent how to formulate this internal analysis request.
# Context Management (Step 4): Explicitly forbids including the raw Observation_HTML in subsequent thoughts/actions, focusing only on the Extracted_Forces_For_This_URL.
# PDF Handling Clarified: Integrated PDF tool usage into the workflow.
# Final Output Clarification: Reinforced that the output aggregates findings from all processed URLs.

futurist_source_identification:
  description: >
    You have these key objectives for SOURCE IDENTIFICATION:
    1. Identify no less than {minimum_number_of_sources} high-quality sources for researching market forces impacting {topic}.
    2. Focus solely on {specialisation} sources, the current date is {date}.
    3. Include at minimum these sources in your search: {research_sources}.
    4. Your primary goal is to identify reputable sources that will yield valuable market forces.

    Expected source identification scope:
    - Minimum of {minimum_number_of_sources} respected {specialisation} publications or thought leaders.
    - Cover multiple domains relevant to {topic}.
    - Prioritise sources published within the last year, considering the current date is {date}.
    - Your thoroughness at this stage is critical to the success of the overall project.

    Source identification process:
    1. Use the internet search tool to identify promising sources.
    2. Begin by exploring the {research_sources} specified.
    3. If the user has provided specific points of interest: {specific_points_of_interest}, use them to guide your search.
    4. For each potential source, evaluate:
      - Relevance to {topic}
      - Credibility in the field of {specialisation}
      - Publication date (preferring recent content)
      - Potential for yielding multiple market forces
    5. After initial extraction, ask yourself: "What related or adjacent market forces might this indicate?"
    6. Keep track of ALL identified source URLs and basic information.
    7. Do not attempt to extract detailed content from sources at this stage.

    Source quality requirements:
    1. **PROVIDE REAL WORKING URLS FOR ALL SOURCES - DO NOT PROVIDE FAKE OR MOCKED SOURCES**
    2. **VERIFY THAT EACH SOURCE IS ACCESSIBLE AND CONTAINS RELEVANT CONTENT**
    3. **ALWAYS EXTRACT AND USE THE ACTUAL PUBLICATION DATE FROM THE SOURCE - DO NOT USE TODAY'S DATE**
    4. **IF A PUBLICATION DATE IS NOT CLEARLY VISIBLE, MAKE A REASONABLE ESTIMATE BASED ON CONTENT OR MARK AS UNKNOWN**

    Performance and incentive:
    1. Your performance will be evaluated based on the quantity and quality of sources identified.
    2. The breadth and diversity of your sources.
    3. The relevance of sources to {topic} and {specialisation}.
    4. The recency and credibility of your sources.

    Your outputs MUST be formatted according to the pydantic output SourceIdentificationResultsURLonly schema.
    Make sure you do not include any markdown formatting that could affect the JSON structure e.g. '''.

  expected_output: >
    You will produce a "Source results URL list" aligned to the  SourceIdentificationResultsURLonly pydantic schema.  Do not include any markdown formatting especially '''
    This output should contain NO LESS THAN {minimum_number_of_sources} high-quality sources for researching market forces relating to {topic} from respected {specialisation} sources. 
  agent: futurist_source_identifier


futurist_market_force_extraction:
  description: >
    Using only the URLs from the "Source results URL list" identified in the previous task related to the SourceIdentificationResultsURLonly schema.  Your MANDATORY objective is to process EACH AND EVERY URL provided in the "Source results URL list" from the 'futurist_source_identification' task to extract market forces related to {topic}. FAILURE TO PROCESS ALL URLS WILL RESULT IN AN INCOMPLETE TASK.
    
    IMPORTANT INSTRUCTIONS FOR ACCESSING URLs:
    1.  Access the "Source results URL list" output JSON provided in the context from the previous task.
    2.  Locate the 'sources' field, which is a list of URL source objects.
    3.  **ITERATE THROUGH THE ENTIRE 'sources' LIST, one by one. For EACH source object URL in the list:**
        a. Extract the value of the 'url' field.
        b. **Use the scrape tool to retrieve the full content from this specific URL.** If scraping fails for a URL after 3 attempts, log the URL as failed and CONTINUE to the next URL in the list. DO NOT STOP the entire process for one failed URL.
        c. **CRITICAL: Handling Scraped Content & Managing History:**
           i. **Internal Analysis First:** After receiving the scraped content in the `Observation` (following step 3b), you MUST first *internally* analyze this content *within your thought process*. Identify potential market forces, key terms, examples, and other relevant details *before* deciding your next `Action` or formulating the `Final Answer`.
           ii. **Summarize, Don't Repeat:** When you formulate your *next* `Thought:` (e.g., deciding to scrape the next URL or preparing the final answer), **DO NOT include the large, raw, unprocessed text from the previous `Observation` in the prompt history.** Instead, briefly summarize the key findings from your internal analysis *if needed for context*, or simply state that you have finished processing the URL (e.g., "Thought: I have processed URL X and extracted Y market forces. Now I will process the next URL."). Keep the history concise to prevent errors and focus the LLM.
        d. Based on your internal analysis (from step 3c), identify ALL mentioned market forces relevant to {topic}.
        e. For each market force found in this specific source (identified during your internal analysis), capture the relevant details according to the RawMarketForce format, ensuring correct attribution to *this* source URL and name. Accumulate these findings.
    4.  Do not follow links and scrape URLs referred to in the content of the URLs provided in the 'sources' list.  Only scrape the URLs provided in the 'sources' list.
    5. Do not directly open PDFs and/or pass the links into the LLM context, if you are required to look at the content of a PDF first download the file using the File Downloader tool then use a PDF search tool to read the file.
    6.  **DO NOT STOP until you have attempted to process every single URL** present in the 'sources' list from the input context.
    7.  Compile ALL accumulated market forces (from step 3e across all URLs) into the final output structure.
    8.  Before finishing, mentally (or explicitly state) confirm: "Have I attempted to scrape and analyze every URL provided in the 'sources' list?"

    Expected research extraction scope - minimum requirements:
    - Extract content from ALL source URLs identified in "Source results URL list" from the previous task's context.
    - Identify as many distinct market forces as possible related to the {topic}.
    - Find relevant specific examples for each market force.
    - Do not conclude your extraction until you have gathered a comprehensive set of market forces across all the source URLs provided in the 'sources' list.
    - Your thoroughness is critical to the success of the overall project.
    - Your research is not complete until you've met or exceeded these minimum requirements.

    Research extraction process:
    Follow the numbered iteration steps 1-7 above meticulously.
    
    Attribution requirements:
    1. For every fact, statistic, quote, example, or finding you include, you MUST provide:
       - The exact URL where the information was found.
       - The specific paragraph or section containing the information, including the exact wording.
       - The name of the source.
    2. Do not paraphrase information - retain key details and numbers as found in the source.
    3. Structure all attributed content according to the AttributedItem format with "content", "source_url", "source_paragraph", and "source_name" fields.

    Research extraction quality:
    1. Compile findings with true and accurate citations and source attributions, ensuring all information is traceable.
    2. **DO NOT PROVIDE FAKE OR MOCKED CONTENT.**
    3. **IF CONTENT CANNOT BE FOUND, INDICATE SO, DO NOT MAKE UP CONTENT OR SOURCES.**
    4. **ALWAYS EXTRACT AND USE THE ACTUAL PUBLICATION DATE FROM THE SOURCE - DO NOT USE TODAY'S DATE.**
    5. **IF A PUBLICATION DATE IS NOT CLEARLY VISIBLE, MAKE A REASONABLE ESTIMATE BASED ON CONTENT OR MARK AS UNKNOWN - NEVER DEFAULT TO TODAY'S DATE.**

    Performance and incentive:
    1. Your performance will be evaluated based on the quantity and quality of market forces identified.
    2. The depth of your analysis (detailed market force descriptions, content, examples, key terms, mentioned entities).
    3. The quality and accuracy of your attributions and citations (exact URLs, paragraphs, and sources).
    
    The most valuable insights often come from comprehensive research that goes beyond the obvious. Your goal is to deliver the most accurate, comprehensive and thorough analysis possible.

    Your output MUST be formatted as a valid JSON object following the ResearchOutput schema (without '''), with each fact, statistic, quote, finding, and example properly attributed using the AttributedItem structure.
    Set the source_category to "{specialisation}" in your response.
  expected_output: >
    A structured list of ALL market forces identified by processing EVERY source URL provided in the SourceIdentificationResultsURLonly context from the previous task, relating to {topic}, with detailed attribution.  This must be in JSON format, Do not include any markdown formatting especially '''
  agent: futurist_content_extractor
  context: [futurist_source_identification]

futurist_reporting_task:
  description: >
    Review the context you got and expand each market force into a full section for a report.
    Make sure the report is detailed and contains any and all relevant information.
    The report should be dated {date}. The document should be written for an expert audience with deep knowledge about the {topic}.

    Report process:
    1. Do not lose any content from the context, make sure to include, and where relevant expand on the context, create all the required report outputs (e.g. key findings, possible signals, possible structural shifts, implications on future of sector, sources)
    2. **PRESERVE THE ORIGINAL SOURCE DATES FROM THE INPUT - DO NOT REPLACE THEM WITH TODAY'S DATE**
    3. Include the following line just below the Title: "Produced by Futureworld & NexusPlus Undrstnd.AI" without quotation marks
    4. Include a copyright notice at the end of the document

    Report quality:
    1. Ensure all information from the context is comprehensively and accurately included in the report.
    2. Compile content with true and accurate citations and source attributions, ensuring all information is traceable.
    3. **PROVIDE REAL WORKING URLS FOR ALL CONTENT - DO NOT PROVIDE FAKE OR MOCKED CONTENT**  
    4. **IF CONTENT CANNOT BE FOUND, INDICATE SO, DO NOT MAKE UP CONTENT OR SOURCES**

    Performace and incentive:
    1. Your performance will be evaluated based on the quantity and quality of your report.

    Your output MUST be formatted as a valid JSON object following the MarketForceReport schema.
  expected_output: >
    A fully fledge reports with all the main topics, each with a full section of information.
  agent: futurist_reporting_analyst
  context: [futurist_market_force_extraction]

futurist_formatting_task:
  description: >
    Format the executive report into a beautiful markdown document without '```'.
    Follow these guidelines:
    1. Use proper markdown headers (#, ##, ###)
    2. Include the following line just below the Title: "Produced by Futureworld & NexusPlus Undrstnd.AI" without quotation marks
    3. Include emojis from the section_emoji field
    4. Format market forces and key findings as bullet points
    5. Add proper spacing and sections breaks
    6. Make implications, signals and structural shifts stand out using blockquotes
    7. Ensure the date is properly formatted
    8. Add a table of contents at the beginning
    9. Use horizontal rules (---) to separate major sections
    10. Add inline citations for each major claim using (Author, Year, URL) format
    11. Include a Sources section at the end with numbered references
    12. Each source should include title, publisher/author, and URL
    13. Link inline citations to the corresponding entry in the Sources section
    14. Include a copyright notice at the end of the document
  expected_output: >
    A beautifully formatted markdown report with proper structure, spacing,
    citations, and visual elements that enhance readability and presentation.
  agent: futurist_formatter
  context: [futurist_market_force_extraction, futurist_reporting_task]

futurist_structure_market_forces:
  description: >
    Convert ALL raw market force findings into structured, standardised market force format.
    
    Expected process:
    - Process ALL raw market forces from the previous research task - Make sure you process all of them
    - For each raw market force:
      1. Generate a unique ID (format: "MF-[source_category]-[number]")
      2. Extract a concise short description from the title
      3. Refine the raw description into a well-structured long description
      4. Standardise examples for clarity and impact
      5. Organise source information consistently
      6. Extract and standardise key terms and entities
    
    Structuring quality requirements:
    1. Ensure consistent terminology across all market forces
    2. Maintain all attribution and source information from raw inputs
    3. Enhance readability without losing substantive information
    4. Remove duplicative content within each market force
    5. Standardise formatting of dates, statistics, and metrics
    6. Make sure you process all of the raw market forces
    
    Contextual awareness:
    1. Consider domain-specific terminology relevant to {topic}
    2. Ensure structured output maintains appropriate professional tone
    3. Preserve industry-specific nuances in the structured format
    
    Your output MUST be formatted as a valid JSON OBJECT with a "market_forces" field containing an ARRAY of StructuredMarketForce objects.
  expected_output: >
    A JSON object containing a "market_forces" array of StructuredMarketForce objects with standardised formatting and enhanced structure.
    The array should contain one object for EACH raw market force from the previous research task.
  agent: futurist_market_force_extractor
  context: [futurist_market_force_extraction]
# tasks.yaml - futurist_market_force_extraction_crew

futurist_market_force_extraction:
  description: >
    You will receive a list of source URLs as input (from the previous crew).

    For each URL, extract all relevant market forces considering the {topic} and {specialisation}. Output must conform to the ResearchOutput schema.

    MARKET FORCE DEFINITION: {market_force_definition}

    URL: {url}

    **MANDATORY WORKFLOW PER URL:**
    1.  Get the next URL from the input list.
    2.  Use the `Scrape and Analyze Website Content` tool for this URL. Let the result be `Observation_HTML`.
    3.  **IMMEDIATE NEXT STEP:** Your *only* goal now is to analyze `Observation_HTML`.
        Think: "I need to extract market forces from the HTML I just received."
        Formulate an internal request to the LLM (yourself) like: "Extract all market forces related to '{topic}' found in this text: [Paste the *full* Observation_HTML here]. Structure the output for just these forces according to the RawMarketForce fields needed (title, raw_description, source_name, source_url, source_date, key_terms, relevance etc.)."
        *You will internally process this request*. The result is `Extracted_Forces_For_This_URL`.
    4.  **AFTER EXTRACTION:**
        Think: "I have now extracted the forces from URL [current URL]. I have accumulated X forces so far. I need to process the next URL OR if this was the last URL, I need to compile the final answer."
        *Crucially, do NOT include the raw `Observation_HTML` in this thought process or subsequent actions.* Only refer to `Extracted_Forces_For_This_URL` if needed.
        Accumulate `Extracted_Forces_For_This_URL` into a master list.
    5.  If there are more URLs in the input list, go back to step 1 for the next URL.
    6.  If all URLs are processed, proceed to format the Final Answer.

    **Overall Task Goal:** Iterate through the list of source URLs provided. For each URL, use the `Scrape and Analyze Website Content` tool. Immediately analyze the retrieved content *in isolation* to extract relevant market forces for {topic}. Accumulate these findings. Once ALL URLs have been processed, compile ALL accumulated market forces into the final JSON output.

    **PDF Handling:** If a URL points to a PDF, use `Download File Tool`, then `Search a PDF's content` tool to get text, then follow these steps:
    1.  Using the Search a PDF's content tool find the relevant text and let the result be `Observation_PDF_extract`.
    2.  **IMMEDIATE NEXT STEP:** Your *only* goal now is to analyze `Observation_PDF_extract`.
        Think: "I need to extract market forces from the PDF extract I just received."
        Formulate an internal request to the LLM (yourself) like: "Extract all market forces related to '{topic}' found in this text: [Paste the *full* Observation_PDF_extract here]. Structure the output for just these forces according to the RawMarketForce fields needed (title, raw_description, source_name, source_url, source_date, key_terms, relevance etc.)."
        *You will internally process this request*. The result is `Extracted_Forces_For_This_PDF_extract`.
    3.  **AFTER EXTRACTION:**
        Think: "I have now extracted the forces from PDF extract [current PDF extract]. I have accumulated X forces so far. I need to process the next PDF extract OR if this is the end of the PDF, I need to compile the final answer."
        *Crucially, do NOT include the raw `Observation_PDF_extract` in this thought process or subsequent actions.* Only refer to `Extracted_Forces_For_This_PDF_extract` if needed.
        Accumulate `Extracted_Forces_For_This_PDF_extract` into a master list.
    4.  If there are more relevant texts in the PDF, go back to step 1 for the next PDF extract.
    5.  If all content in the PDF has been processed, proceed to format the Final Answer.

    **Error Handling:** If scraping a URL fails after 3 attempts, note it and move to the next URL.

    **Final Output:** Compile ALL market forces extracted from ALL *successfully processed* URLs into a single JSON object conforming to the `ResearchOutput` schema. Set `source_category` to "{specialisation}". Include a summary reflecting the process (e.g., number of URLs processed, number failed, number of forces found).

    **(Constraint Reminder):** Adhere strictly to the attribution requirements and quality standards previously mentioned (no mocking, use real dates, attribute accurately).  
  expected_output: >
    A valid ResearchOutput object containing all raw_market_forces extracted from the provided URLs.
  agent: futurist_content_extractor
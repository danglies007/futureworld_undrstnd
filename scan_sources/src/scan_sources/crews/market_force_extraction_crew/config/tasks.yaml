# tasks.yaml - futurist_market_force_extraction_crew

futurist_market_force_extraction:
  description: >
    You will receive a list of source URLs as input (from the previous crew).

    URL: {url}

    For each URL, extract all relevant market forces considering the {topic} and {specialisation}. 
    Output must conform to the ResearchOutput schema.

    MARKET FORCE DEFINITION: {market_force_definition}

    **Market Force Qualification Criteria:**
    To qualify as a market force per the definition, extracted forces MUST:
      1. Represent external drivers (not internal company strategies)
      2. Show evidence of influence on the {topic} domain
      3. Demonstrate persistence over medium to long term
      4. Exhibit measurable or emerging momentum
      5. Have potential impact on strategic decision-making

    **MANDATORY WORKFLOW PER URL:**
    1.  Get the next URL from the input list.
    2.  Determine if URL points to PDF or HTML content.
    
    **For HTML Content:**
    3.  Use the `Scrape and Analyze Website Content` tool for this URL. Let the result be `Observation_HTML`.
    4.  **IMMEDIATE NEXT STEP:** Your *only* goal now is to analyze `Observation_HTML`.
        Think: "I need to extract market forces from the HTML I just received."
        Formulate an internal request to the LLM (yourself) like: "Extract all market forces related to '{topic}' found in this text: [Paste the *full* Observation_HTML here]. Structure the output for just these forces according to the RawMarketForce fields needed (title, raw_description, source_name, source_url, source_date, key_terms, etc.)."
        *You will internally process this request*. The result is `Extracted_Forces_For_This_URL`.
    5.  **AFTER EXTRACTION:**
        Think: "I have now extracted the forces from URL [current URL]. I have accumulated X forces so far. I need to process the next URL OR if this was the last URL, I need to compile the final answer."
        *Crucially, do NOT include the raw `Observation_HTML` in this thought process or subsequent actions.* Only refer to `Extracted_Forces_For_This_URL` if needed.
        Accumulate `Extracted_Forces_For_This_URL` into a master list.
    
    **For PDF Content:**
    6.  If a URL points to a PDF, use `Download File Tool` to download it, then use the RAG-based `Search a PDF's content` tool with this comprehensive search strategy:
        a. First, use a broad query with the primary topic: 
           query: "{topic}"
           Store the result as `Observation_PDF_extract_1`.
        b. Then perform additional targeted semantic searches:
           - query: "What are the key trends related to {topic}?" → `Observation_PDF_extract_2`
           - query: "What challenges or barriers exist for {topic}?" → `Observation_PDF_extract_3`
           - query: "What regulatory factors affect {topic}?" → `Observation_PDF_extract_4`
           - query: "What are the main market drivers for {topic}?" → `Observation_PDF_extract_5`
           - query: "From a {specialisation} perspective, how will {topic} evolve?" → `Observation_PDF_extract_6`
           - query: "What external drivers influence {topic}?" → `Observation_PDF_extract_7`
           - query: "What significant market forces are shaping {topic}?" → `Observation_PDF_extract_8`
    7.  **IMMEDIATE NEXT STEP:** For each separate `Observation_PDF_extract_N`:
        a. Think: "I need to extract market forces from this semantic search result."
        b. Formulate an internal request to the LLM (yourself) like: "Extract all market forces related to '{topic}' found in this text: [Paste the *full* current Observation_PDF_extract_N here]. Structure the output for just these forces according to the RawMarketForce fields needed."
        c. *You will internally process this request for each extract separately*. The result for each is `Extracted_Forces_For_This_PDF_Extract_N`.
        d. *Crucially, do NOT include the raw `Observation_PDF_extract_N` in subsequent thought processes or actions.* Only refer to `Extracted_Forces_For_This_PDF_Extract_N`.
        e. Accumulate all `Extracted_Forces_For_This_PDF_Extract_N` into `Extracted_Forces_For_This_PDF`.
        f. Deduplicate any identical or very similar market forces found across different extracts.
    8.  **AFTER EXTRACTION:**
        Think: "I have now extracted the forces from all PDF extracts for [current PDF URL]. I have accumulated X forces so far. I need to process the next URL OR if this was the last URL, I need to compile the final answer."
        *Crucially, do NOT include any raw PDF extracts in this thought process or subsequent actions.*
        Accumulate `Extracted_Forces_For_This_PDF` into the master list.
    
    **Source Date Extraction:**
    9.  When extracting dates from sources:
        a. Always look for actual publication dates in metadata, bylines, or document properties
        b. Never generate or assume a date - only use dates explicitly stated in the source document
        c. If no date is found after thorough searching, set source_date to "Unknown"
        d. Validate all extracted dates using the source_date validator in the RawMarketForce model
    
    **Zero Results Handling:**
    10. If no market forces are found after initial analysis:
        a. Broaden the interpretation while staying true to the definition
        b. Look for implicit market forces in the already extracted content (do NOT re-include the full raw content)
        c. Document broadening steps in your process notes
    
    **Minimum Output Requirements:**
    11. Must extract at least {minimum_number_of_forces} distinct market forces across all sources
        If still insufficient after broadening, document the limitations of the source material
    
    **After Complete URL Processing:**
    12. If there are more URLs in the input list, go back to step 1 for the next URL.
    13. If all URLs are processed, proceed to format the Final Answer.
    
    **Error Handling:**
    14. If scraping a URL fails or if the PDF search tool returns errors:
        a. For HTML content issues, retry up to 3 times with different approaches
        b. For PDF search issues:
           - Ensure the PDF was downloaded correctly
           - Try with simpler, shorter queries if the semantic search is failing
           - If using specific PDF path references, verify the path is correct
        c. After 3 failed attempts, document the failed URL and move on
    
    **Quality Control Checklist:** 
    15. Before finalizing output:
        a. Verify each market force has all required fields from the RawMarketForce schema
        b. Ensure each force's description is substantial (min 20 words)
        c. Validate that descriptions truly reflect external forces (not just product features)
        d. Confirm all sources have accurate attribution with real dates (not assumed)
        e. Check that each force is distinct (no duplicates)
        f. Ensure all forces actually relate to {topic} and {specialisation}
    
    **Final Output:**
    16. Compile ALL market forces into a single ResearchOutput object with:
        - source_category: Set to {specialisation}
        - url: URL being processed
        - summary: Processing summary including statistics
        - raw_market_forces: Array of RawMarketForce objects
    
    **Schema Validation:**
    17. Ensure final output strictly adheres to the ResearchOutput schema

    **(Constraint Reminder):** Adhere strictly to the attribution requirements and quality standards.
    
  expected_output: >
    A valid ResearchOutput object containing at least {minimum_number_of_forces} market forces extracted from the provided URLs.
  agent: futurist_content_extractor
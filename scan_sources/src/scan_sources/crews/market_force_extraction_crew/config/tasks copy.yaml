# tasks.yaml - futurist_market_force_extraction_crew

futurist_market_force_extraction:
  description: >
    For the given URL, extract all relevant market forces considering the {topic} and {specialisation}. Output must conform to the ResearchOutput schema.

    URL: {url}

    **MANDATORY WORKFLOW PER URL:**
    1.  Use the `Read website content` tool for this URL. Let the result be `Observation_HTML`.
    2.  **IMMEDIATE NEXT STEP:** Your *only* goal now is to analyze `Observation_HTML`.
        Think: "I need to extract market forces from the HTML I just received."
        Formulate an internal request to the LLM (yourself) like: "Extract all market forces related to '{topic}' found in this text: [Paste the *full* Observation_HTML here]. Structure the output for just these forces according to the RawMarketForce fields needed (title, raw_description, source_name, source_url, source_date, key_terms, relevance etc.)."
        *You will internally process this request*. The result is `Extracted_Forces_For_This_URL`.
    3.  **AFTER EXTRACTION:**
        Think: "I have now extracted the forces from URL. I have accumulated X forces so I need to compile the final answer."
        *Crucially, do NOT include the raw `Observation_HTML` in this thought process or subsequent actions.* Only refer to `Extracted_Forces_For_This_URL` if needed.
        Accumulate `Extracted_Forces_For_This_URL` into a master list.

    **Overall Task Goal:** For the provided URL, use the `Read website content` tool. Immediately analyze the retrieved content *in isolation* to extract relevant market forces for {topic}. Accumulate these findings.

    **PDF Handling:** If a URL points to a PDF, use `Download File Tool`, then `Search a PDF's content` tool to get text, then follow the same analysis steps (2 & 3) for the retrieved text.

    **Error Handling:** If scraping a URL fails after 3 attempts, note it and move on.

    **Final Output:** Compile ALL market forces extracted from the *successfully processed* URL into a single JSON object conforming to the `ResearchOutput` schema. Set `source_category` to "{specialisation}". Include a summary reflecting the process (e.g., number of URLs processed, number failed, number of forces found).

    **(Constraint Reminder):** Adhere strictly to the attribution requirements and quality standards previously mentioned (no mocking, use real dates, attribute accurately).
  expected_output: >
    A valid ResearchOutput object containing all raw_market_forces extracted from the provided URLs.
  agent: futurist_content_extractor
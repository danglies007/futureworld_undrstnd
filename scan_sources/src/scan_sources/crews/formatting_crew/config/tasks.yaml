# tasks.yaml - formatting_crew

markdown_formatting_task:
  description: >
    You will receive a Market Force Analysis Report as input. Format it as a beautiful markdown document, following the specified formatting guidelines.

    MARKET FORCE ANALYSIS REPORT: {report_final_content}
    
    Format the executive report into a beautiful markdown document without '```'.

    1. Use proper markdown headers (#, ##, ###).
    2. Include the following line just below the Main Title: "Produced by Futureworld & NexusPlus Undrstnd.AI" without quotation marks.
    3. Do not try to overly summarize or condense the content provided.
    4. Provide an overview of the all the market forces in the report just below the executive summary with a short description of each market force.
    5. Do not rename any of the market forces provided anywhere in the report as cross referenceing may be required throughout the report. 
    6. Include key findings and key insights as bullet points, if implications and explanations are available include them here.  
    7. Add proper spacing and sections breaks.
    8. Make the strap line, implications, signals and related forces and takeout stand out using blockquotes.
    9. Where impact assessments are given, include the impact rationale.
    10. Ensure the date is properly formatted.
    11. Add a table of contents at the beginning.
    12. Use horizontal rules (---) to separate major sections.
    13. Add inline clickable citations for each major claim, key finding or key insight using (Author, URL) format.  Make these a different color to the standard text.
    14. Include a Sources section at the end with numbered references.
    15. Each source should include title, date, publisher/author, and URL.
    16. Link inline citations to the corresponding entry in the Sources section.
    17. Add a glossary at the end.
    18. Add a copyright notice at the end: "© {date} Futureworld & NexusPlus. All rights reserved."
    19. Ensure all content from the MarketForceAnalysisReport object are considered and incorporated into the final report.
    20. Do not leave content out or information due to perceived length constraints, this is a full report not a summary.

    **Quality Requirements**
    1. Do not rename or change the names of any of the market forces provided anywhere in the initial report as cross referenceing may be required throughout the report. 

  expected_output: >
    A beautifully formatted markdown report with proper structure, spacing, citations, and visual elements that enhance readability and presentation.  It should include all content, required formatting, sections, and attributions.
  agent: markdown_formatter



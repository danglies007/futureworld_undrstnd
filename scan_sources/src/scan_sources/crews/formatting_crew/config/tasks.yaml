# tasks.yaml - futurist_formatting_crew

futurist_formatting_task:
  description: >
    You will receive a Market Force Analysis Report as input. Format it as a beautiful markdown document, following the specified formatting guidelines.

    MARKET FORCE ANALYSIS REPORT: {report_final_content}
    
    1. Use proper markdown headers (#, ##, ###).
    2. Include the following line just below the Main Title: "Produced by Futureworld & NexusPlus Undrstnd.AI" without quotation marks.
    3. Do not try to overly summarize or condense the content provided.
    4. Provide an overview of the all the market forces in the report just below the executive summary with a short description of each market force.
    5. Do not rename any of the market forces provided anywhere in the report as cross referenceing may be required throughout the report. 
    6. Include key findings and key insights as bullet points, if implications and explanations are available include them here.  
    7. Add proper spacing and sections breaks.
    8. Make implications, signals and related forces stand out using blockquotes.
    9. Where impact assessments are given, include the impact rationale.
    10. Ensure the date is properly formatted.
    11. Add a table of contents at the beginning.
    12. Use horizontal rules (---) to separate major sections.
    13. Add inline citations for each major claim, key finding or key insight using (Author, Year, URL) format.
    14. Include a Sources section at the end with numbered references.
    15. Each source should include title, publisher/author, and URL.
    16. Link inline citations to the corresponding entry in the Sources section.
    17. Add a copyright notice at the end: "© {date} Futureworld & NexusPlus. All rights reserved."
    18. Ensure all content from the MarketForceAnalysisReport object is considered and incorporated into the final report.
  expected_output: >
    A beautifully formatted markdown report with proper structure, spacing, citations, and visual elements that enhance readability and presentation.  It should include all necessary content, required formatting, sections, and attributions.
  agent: futurist_formatter
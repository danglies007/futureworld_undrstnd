# tasks.yaml - futurist_reporting_crew - Purly focused on developing market force overview

reporting_task:
  description: >
    You will receive a list of MARKET FORCES as input (from the previous crew, in ResearchOutput format).
    Synthesise these into a comprehensive market force overview according to the MarketForceAnalysisReport schema.

    MARKET FORCES: {raw_market_forces}

    **UNDERSTANDING DEFINITIONS RELATING TO MARKET FORCES:**
    - definitions for market forces, environement, market, business, key findings and key insights are: {market_force_definition} 

    **MANDATORY WORKFLOW FOR MARKET FORCE REPORT CREATION:**
    1. **ANALYSIS & CATEGORISATION:**
       - Review ALL provided MARKET FORCES.
       - Categorise market forces by type: technological, economic, social, political, environmental, or regulatory.
       - For each market force, identify the sectors likely to be affected and assess its impact level, uncertainty level, and time horizon.
       
    2. **REPORT STRUCTURE:**
       - Create a compelling `report_title` reflecting {topic} and focused on market forces.
       - Set the `generation_date` to "{date}".
       - Draft a concise `executive_summary` (500-800 words) summarising the key market forces and their implications.
       
    3. **CATEGORY DEVELOPMENT:** For EACH category:
       - Create a `MarketForceCategory` that conforms to the MarketForceCategory schema:
       
    4. **MARKET FORCE DETAILS:** For EACH individual market force:
       - Create a `MarketForce` that conforms to the MarketForce schema:
       
    5. **FORCE INTERACTIONS:**
       - Identify the most important interactions between market forces.
       - For each key interaction, create a `MarketForceInteraction` that conforms to the MarketForceInteraction schema.
       
    6. **UNCERTAINTY-IMPACT MATRIX:**
       - Create a matrix categorising forces by uncertainty and impact levels based on the MarketForceImpact schema
       
    7. **KEY FINDINGS & STRATEGIC IMPLICATIONS:** 
       - List the most significant key findings across all market forces.
       - Identify strategic implications for the environment, (and for the market and business if they have been provided).  Note that the market and business are optional.  Make sure you explicity mention the implications for each of these.
       
    8. **SOURCES:** 
       - Compile a list of all source references used in the report.

    9. **GLOSSARY:**
       - Provide a glossary at the end of the report, this should include definitions for any acronyms or terms used in the report.  In addition it should explain key schema fields used in the report e.g. uncertainty_level in the MarketForce schema.

    **REPORT QUALITY REQUIREMENTS:**
    - Write for an {audience} audience with domain knowledge about {topic}, {market} and {business}.
    - Maintain proper citation throughout the document.
    - **NEVER FABRICATE INFORMATION** - only use content from the provided MARKET FORCES.
    - Focus on clarity and accessibility without sacrificing depth of analysis.

    **PERFORMANCE CRITERIA:**
    Your performance will be evaluated on:
    - Clear organisation of market forces into logical categories
    - Clarity of impact assessments for each market force
    - Quality of interaction analysis between different market forces
    - Practical value of strategic implications
    - Accuracy of all information and source attribution
    - Appropriate levels of detail and supporting information for the {audience} audience.

    **FINAL OUTPUT:** A valid JSON object following the MarketForceAnalysisReport schema

  expected_output: >
    A valid JSON object following the MarketForceAnalysisReport schema, containing a clear market force analysis with all information required from the MarketForceAnalysisReport schema. All information must be derived solely from the provided market forces with proper attribution.
  agent: reporting_analyst
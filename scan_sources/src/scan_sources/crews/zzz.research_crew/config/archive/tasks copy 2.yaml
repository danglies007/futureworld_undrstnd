# tasks.yaml - futurist_research_crew

# Before changes to insights and findings - only changed the futurist_reporting_task

futurist_source_identification:
  description: >
    You have these key objectives for SOURCE IDENTIFICATION:
    1. Identify no less than {minimum_number_of_sources} high-quality sources for researching market forces impacting {topic}.
    2. Focus solely on {specialisation} sources, the current date is {date}.
    3. Include at minimum these sources in your search: {research_sources}.
    4. Your primary goal is to identify reputable sources that will yield valuable market forces.

    Expected source identification scope:
    - Minimum of {minimum_number_of_sources} respected {specialisation} publications or thought leaders.
    - Cover multiple domains relevant to {topic}.
    - Prioritise sources published within the last year, considering the current date is {date}.
    - Your thoroughness at this stage is critical to the success of the overall project.

    Source identification process:
    1. Use the internet search tool to identify promising sources.
    2. Begin by exploring the {research_sources} specified.
    3. If the user has provided specific points of interest: {specific_points_of_interest}, use them to guide your search.
    4. For each potential source, evaluate:
      - Relevance to {topic}
      - Credibility in the field of {specialisation}
      - Publication date (preferring recent content)
      - Potential for yielding multiple market forces
    5. After initial extraction, ask yourself: "What related or adjacent market forces might this indicate?"
    6. Keep track of ALL identified source URLs and basic information.
    7. Do not attempt to extract detailed content from sources at this stage.

    Source quality requirements:
    1. **PROVIDE REAL WORKING URLS FOR ALL SOURCES - DO NOT PROVIDE FAKE OR MOCKED SOURCES**
    2. **VERIFY THAT EACH SOURCE IS ACCESSIBLE AND CONTAINS RELEVANT CONTENT**
    3. **ALWAYS EXTRACT AND USE THE ACTUAL PUBLICATION DATE FROM THE SOURCE - DO NOT USE TODAY'S DATE**
    4. **IF A PUBLICATION DATE IS NOT CLEARLY VISIBLE, MAKE A REASONABLE ESTIMATE BASED ON CONTENT OR MARK AS UNKNOWN**

    Performance and incentive:
    1. Your performance will be evaluated based on the quantity and quality of sources identified.
    2. The breadth and diversity of your sources.
    3. The relevance of sources to {topic} and {specialisation}.
    4. The recency and credibility of your sources.

    Your outputs MUST be formatted according to the pydantic output SourceIdentificationResultsURLonly schema.
    Make sure you do not include any markdown formatting that could affect the JSON structure e.g. '''.

  expected_output: >
    You will produce a "Source results URL list" aligned to the  SourceIdentificationResultsURLonly pydantic schema.  Do not include any markdown formatting especially '''
    This output should contain NO LESS THAN {minimum_number_of_sources} high-quality sources for researching market forces relating to {topic} from respected {specialisation} sources. 
  agent: futurist_source_identifier


futurist_market_force_extraction:
  description: >
    Using only the URLs from the "Source results URL list" context, process EACH URL to extract market forces related to {topic}.

    **MANDATORY WORKFLOW PER URL:**
    1.  Get the next URL from the input `sources` list.
    2.  Use the `Read website content` tool for this URL. Let the result be `Observation_HTML`.
    3.  **IMMEDIATE NEXT STEP:** Your *only* goal now is to analyze `Observation_HTML`.
        Think: "I need to extract market forces from the HTML I just received."
        Formulate an internal request to the LLM (yourself) like: "Extract all market forces related to '{topic}' found in this text: [Paste the *full* Observation_HTML here]. Structure the output for just these forces according to the RawMarketForce fields needed (title, raw_description, source_name, source_url, source_date, key_terms, relevance etc.)."
        *You will internally process this request*. The result is `Extracted_Forces_For_This_URL`.
    4.  **AFTER EXTRACTION:**
        Think: "I have now extracted the forces from URL [current URL]. I have accumulated X forces so far. I need to process the next URL OR if this was the last URL, I need to compile the final answer."
        *Crucially, do NOT include the raw `Observation_HTML` in this thought process or subsequent actions.* Only refer to `Extracted_Forces_For_This_URL` if needed.
        Accumulate `Extracted_Forces_For_This_URL` into a master list.
    5.  If there are more URLs in the input list, go back to step 1 for the next URL.
    6.  If all URLs are processed, proceed to format the Final Answer.

    **Overall Task Goal:** Iterate through the list of source URLs provided in the context. For each URL, use the `Read website content` tool. Immediately analyze the retrieved content *in isolation* to extract relevant market forces for {topic}. Accumulate these findings. Once ALL URLs have been processed, compile ALL accumulated market forces into the final JSON output.

    **PDF Handling:** If a URL points to a PDF, use `Download File Tool`, then `Search a PDF's content` tool to get text, then follow the same analysis steps (3 & 4) for the retrieved text.

    **Error Handling:** If scraping a URL fails after 3 attempts, note it and move to the next URL.

    **Final Output:** Compile ALL market forces extracted from ALL *successfully processed* URLs into a single JSON object conforming to the `ResearchOutput` schema. Set `source_category` to "{specialisation}". Include a summary reflecting the process (e.g., number of URLs processed, number failed, number of forces found).

    **(Constraint Reminder):** Adhere strictly to the attribution requirements and quality standards previously mentioned (no mocking, use real dates, attribute accurately).
  expected_output: >
    A valid JSON object following the ResearchOutput schema, containing a consolidated list of ALL `raw_market_forces` extracted from processing EVERY URL provided in the context (or noting failures), with detailed attribution. The JSON should not contain markdown formatting like ```.
  agent: futurist_content_extractor
  context: [futurist_source_identification]

futurist_reporting_task:
  description: >
    Using the raw market forces provided in the context, create a comprehensive executive report on {topic} by following this structured approach:

    **MANDATORY WORKFLOW FOR REPORT CREATION:**
    1. **INITIAL ANALYSIS:** Review ALL raw market forces in the context. Group related forces by themes.
    2. **REPORT STRUCTURE CREATION:** 
       - Create a report title that reflects the {topic} and key findings
       - Draft an executive summary highlighting the most significant insights
       - Prepare section headers for each major theme identified
    3. **SECTION DEVELOPMENT:** For EACH theme/section:
       - Synthesize information from ALL relevant market forces within that theme
       - Expand with detailed analysis, interconnections, and implications
       - Include verbatim quotes, statistics, and examples from the original sources
       - **PRESERVE ALL SOURCE ATTRIBUTION** including exact publication dates and URLs
    4. **KEY FINDINGS COMPILATION:** Extract the most significant insights across all sections
    5. **SOURCES DOCUMENTATION:** Compile a comprehensive list of all sources used

    **REPORT QUALITY REQUIREMENTS:**
    - Write for an expert audience with deep domain knowledge about {topic}
    - Include the line "Produced by Futureworld & NexusPlus Undrstnd.AI" below the title
    - Maintain academic-level citation practices throughout the document
    - **NEVER FABRICATE INFORMATION** - only use content from the provided market forces
    - **PRESERVE ALL ORIGINAL SOURCE DATES** - do not substitute with current date
    - Add a copyright notice at the end: "© {date} Futureworld & NexusPlus. All rights reserved."

    **PERFORMANCE CRITERIA:**
    Your performance will be evaluated on:
    - Comprehensive inclusion of ALL market forces from the context
    - Depth and quality of analysis and synthesis
    - Accuracy of source attribution
    - Logical organization and flow of information
    - Relevance and actionability of insights for the target audience

    **FINAL OUTPUT:** A complete MarketForceReport JSON object containing:
    - report_title: A compelling title for the overall report
    - generation_date: "{date}
    - executive_summary: A concise overview of key findings (500-800 words)
    - key_findings: List of the most significant insights with their sources
    - report_sections: Detailed analysis organized by themes, with all required fields
    - sources: Complete list of all sources referenced, with accurate URLs and dates

  expected_output: >
    A valid JSON object following the MarketForceReport schema, containing a comprehensive executive report that synthesizes all market forces provided in the context. The report should be well-structured with sections covering all major themes, include proper attribution throughout, and maintain the highest standards of accuracy and detail.
  agent: futurist_reporting_analyst
  context: [futurist_market_force_extraction]

futurist_formatting_task:
  description: >
    Format the executive report into a beautiful markdown document without '```'.
    Follow these guidelines:
    1. Use proper markdown headers (#, ##, ###)
    2. Include the following line just below the Title: "Produced by Futureworld & NexusPlus Undrstnd.AI" without quotation marks
    3. Include emojis from the section_emoji field
    4. Format market forces and key findings as bullet points
    5. Add proper spacing and sections breaks
    6. Make implications, signals and structural shifts stand out using blockquotes
    7. Ensure the date is properly formatted
    8. Add a table of contents at the beginning
    9. Use horizontal rules (---) to separate major sections
    10. Add inline citations for each major claim using (Author, Year, URL) format
    11. Include a Sources section at the end with numbered references
    12. Each source should include title, publisher/author, and URL
    13. Link inline citations to the corresponding entry in the Sources section
    14. Include a copyright notice at the end of the document
  expected_output: >
    A beautifully formatted markdown report with proper structure, spacing,
    citations, and visual elements that enhance readability and presentation.
  agent: futurist_formatter
  context: [futurist_market_force_extraction, futurist_reporting_task]

futurist_structure_market_forces:
  description: >
    Convert ALL raw market force findings into structured, standardised market force format.
    
    Expected process:
    - Process ALL raw market forces from the previous research task - Make sure you process all of them
    - For each raw market force:
      1. Generate a unique ID (format: "MF-[source_category]-[number]")
      2. Extract a concise short description from the title
      3. Refine the raw description into a well-structured long description
      4. Standardise examples for clarity and impact
      5. Organise source information consistently
      6. Extract and standardise key terms and entities
    
    Structuring quality requirements:
    1. Ensure consistent terminology across all market forces
    2. Maintain all attribution and source information from raw inputs
    3. Enhance readability without losing substantive information
    4. Remove duplicative content within each market force
    5. Standardise formatting of dates, statistics, and metrics
    6. Make sure you process all of the raw market forces
    
    Contextual awareness:
    1. Consider domain-specific terminology relevant to {topic}
    2. Ensure structured output maintains appropriate professional tone
    3. Preserve industry-specific nuances in the structured format
    
    Your output MUST be formatted as a valid JSON OBJECT with a "market_forces" field containing an ARRAY of StructuredMarketForce objects.
  expected_output: >
    A JSON object containing a "market_forces" array of StructuredMarketForce objects with standardised formatting and enhanced structure.
    The array should contain one object for EACH raw market force from the previous research task.
  agent: futurist_market_force_extractor
  context: [futurist_market_force_extraction]
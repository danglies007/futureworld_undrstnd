# tasks.yaml for source identification crew

source_discovery:
  description: >

    Your goal is to discover relevant recent urls from a diverse range of sources relating to {topic} for further evaluation.
    
    You have these key objectives for INITIAL URL DISCOVERY:
    1. Identify a broad initial pool of 15-20 potentially valuable urls for researching {topic}.
    2. Focus on urls with relevance to the {topic}, 
    3. Focus on more recent urls, considering the current date is {date} - Do not include urls more than 1 year old.
    4. Include at minimum these sources in your search: {research_sources}.

    Discovery process:
    1. Use the internet search tool to identify promising urls.
    2. Begin by exploring the research_sources specified.
    3. If provided, use {specific_points_of_interest} to guide your search.
    4. Capture basic information about each url (URL, title, publication date).
    5. DO NOT attempt to scrape or read content in detail.
    6. Ensure diversity in url types and perspectives.
    
    Source quality requirements:
    1. **PROVIDE REAL WORKING URLS FOR ALL SOURCES - DO NOT PROVIDE FAKE OR MOCKED SOURCES**
    2. **DO NOT CAPTURE LINKEDIN POSTS OR LINKEDIN COMMENTS**
    3. **DO NOT CAPTURE YOUTUBE VIDEOS OR YOUTUBE COMMENTS**
    4. **CLASSIFY THE SOURCE TYPE as PDF, WEBSITE, YOUTUBE OR OTHER**
    5. **DO NOT INCLUDE ANY PAYWALLED OR SUBSCRIPTION ONLY SOURCES**
    
    Your output must conform to the PotentialSourcesURLOnly model.

  expected_output: >
    A list of potential sources for evaluation, structured according to the PotentialSourcesURLOnly model.
  agent: source_scout

source_evaluation:
  description: >
    Using the list of urls from the source_scout agent as your ONLY input, evaluate each url following the workflow shown below.

    GOAL: Process each and every url.  For each url provided, gather the url metadata and the source information to to evaluate and score it on:
    - relevance, 
    - credibility
    - recency
    In addition you should test the accessibility of each URL.  You will process each URL individually to ensure that you have evaluated and scored all sources.
    
    **MANDATORY WORKFLOW PER SOURCE:**
    1. For each url you will score it between 1 and 10, where 1 is the lowest and 10 is the highest:
      - Relevance to {topic} (1-10) - score the url lower if it links to a overview site with no significant content
      - Credibility of source/author (1-10)
      - Recency (1-10, with a high priority for sources published more recently, score 0 for any sources published more than 1 year ago given the current date is {date}) example of recency rating:
      - greater than 1 year old source: 0 
      - greater than 6 months old source: 7
      - greater than 3 months old source: 9
      - less than 1 month old source: 10
      
    2. Calculate a total score by taking the sum of the relevance, credibility and recency scores
    3. Accessibility - Test if the url links to a valid website or PDF, if the site is valid inidicate it with "True" if not indicate it with "False" - eliminate any paywalled or overview sites with no significant content 
    4. In order to score the url you will need to:
      - Determine if the url is a website or pdf, based on the source type.
      - If the source type is "website":
        1. Use a tool to read the website content for this url. Let the result be `Observation_HTML`.
        2. **IMMEDIATE NEXT STEP:** Your *only* goal now is to analyze `Observation_HTML`.
          Think: "I need to evaluate this url based on the HTML I just received."
          Formulate an internal request to yourself like: "Evaluate this url based on this content: [Paste the *full* Observation_HTML here]. Score it on relevance (1-10), credibility (1-10), and recency (1-10)."
          *You will internally process this request*. The result is `Evaluation_For_This_URL`.
      - If the source type is a pdf:
        1. Do NOT try to read the pdf content or open the pdf file
        2. Instead, assess quality based on the url metadata only
        3. Include the note "PDF document - quality assessed from metadata only" in any PDF descriptions

    **VERY IMPORTANT: Process each url ONE BY ONE to avoid context window limitations. Do not attempt to process all urls at once.**

  expected_output: >
    A complete list of all urls, which have been evaluated and scored.  The final output should be structured according to the EvaluatedSources model.
  agent: source_evaluator


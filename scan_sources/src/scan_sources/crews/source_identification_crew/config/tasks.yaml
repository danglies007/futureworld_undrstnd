metadata_extraction:
  description: >
    Convert the urls with total scores greater than {source_score_threshold} into a JSON list of urls with populated information for each url, structured according to the ApprovedSources model.

    Provide no more than {minimum_number_of_sources} urls in your final output.  Ensure you prioritize urls with the highest total scores.

    CRITICAL: Your final output must be PURE JSON without any markdown formatting, explanation text, or code blocks. DO NOT wrap your output in ```json``` tags or any other formatting.
  expected_output: >
    A pure JSON object containing no more than {minimum_number_of_sources} urls prioritized by total score, conforming exactly to the ApprovedSources schema.
  agent: metadata_extractor



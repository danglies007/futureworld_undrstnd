# tasks.yaml - futurist_source_identification

futurist_source_identification:
  description: >
    You have these key objectives for SOURCE IDENTIFICATION:
    1. Identify no less than {minimum_number_of_sources} and no more than {maximum_number_of_sources} high-quality sources for researching market forces impacting {topic}.
    2. Focus solely on {specialisation} sources with relevant to the {topic}, the current date is {date}.
    3. Include at minimum these sources in your search: {research_sources}.
    4. Your primary goal is to identify reputable sources that will yield valuable and relevant market forces.
    5. Your audience is {audience}.

    Market Force Definition: {market_force_definition}

    Expected source identification scope:
    - Minimum of {minimum_number_of_sources} respected {specialisation} publications or thought leaders.
    - Cover multiple domains relevant to {topic}.
    - Prioritise sources published that are published more recently, considering the current date is {date}.
    - Your thoroughness at this stage is critical to the success of the overall project.

    Source identification process:
    1. Use the internet search tool to identify promising sources.
    2. Begin by exploring the {research_sources} specified.
    3. If the user has provided specific points of interest: {specific_points_of_interest}, use them to guide your search.
    4. For each potential source, evaluate:
      - Relevance to {topic}
      - Credibility in the field of {specialisation}
      - Publication date (preferring recent content)
      - Potential for yielding market forces
      - You can score each one of these criteria on a scale of 1 to 10.
    5. After initial extraction, ask yourself: "What related or adjacent market forces might this indicate?"
    6. Keep track of ALL identified source URLs and basic information.
    7. Do not attempt to extract detailed content from sources at this stage.

    Source quality requirements:
    1. **PROVIDE REAL WORKING URLS FOR ALL SOURCES - DO NOT PROVIDE FAKE OR MOCKED SOURCES**
    2. **VERIFY THAT EACH SOURCE IS ACCESSIBLE AND CONTAINS RELEVANT CONTENT**
    3. **ALWAYS EXTRACT AND USE THE ACTUAL PUBLICATION DATE FROM THE SOURCE - DO NOT USE TODAY'S DATE**
    4. **IF A PUBLICATION DATE IS NOT CLEARLY VISIBLE, MARK AS UNKNOWN**
    5. **DO NOT CAPTURE LINKEDIN POSTS OR LINKEDIN COMMENTS**
    6. **DO NOT CAPTURE YOUTUBE VIDEOS OR YOUTUBE COMMENTS**
    
    **Source Title Extraction:**
    When extracting titles from sources:
      a. Always look for actual title near the top of the source or in metadata, bylines, or document properties
      b. Never generate or assume a title - only use titles explicitly stated in the source document
      c. If no title is found after thorough searching, create your own title based on the source content and but clearly indicate that it is a generated title.

    **Source Date Extraction:**
    When extracting dates from sources:
      a. Always look for actual publication dates, this is normally shown near the top or the bottom of the source.  Otherwise look in metadata, bylines, or document properties, sometimes its classifed as "datepublished" or "datecreated".
      b. Never generate or assume a date - only use dates explicitly stated in the source document
      c. If no date is found after thorough searching, set source_date to "Unknown"

    Performance and incentive:
    1. Your performance will be evaluated based on the quantity and quality of sources identified.
    2. The breadth and diversity of your sources.
    3. The relevance of sources to {topic} and {specialisation} and any other specific points of interest if provided.
    4. The recency and credibility of your sources.

    Your outputs MUST be formatted according to the pydantic output SourceIdentificationResults schema.
    Make sure you do not include any markdown formatting that could affect the structure e.g. '''.

  expected_output: >
    You will produce a "Source results list" aligned to the SourceIdentificationResults pydantic schema.  Do not include any markdown formatting especially '''
    This output should contain NO LESS THAN {minimum_number_of_sources} and no more than {maximum_number_of_sources} high-quality sources for researching market forces relating to {topic} from respected {specialisation} sources. 
  agent: futurist_source_identifier

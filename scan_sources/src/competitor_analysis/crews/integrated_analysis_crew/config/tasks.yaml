create_integrated_analysis:
  description: >
    **GOAL**
    You will synthesize all analyses into a comprehensive, integrated view of {company_name}, ticker symbol: {ticker_symbol}, industry: {industry} that balances insider perspectives with outside objectivity. The current date is {date}.
    
    **KEY FOCUS AREAS RELATING TO THE GOAL**
    1. Executive summary of key findings and insights
    2. Company background and evolution narrative
    3. Business model assessment and sustainability
    4. Market positioning and competitive dynamics
    5. Performance assessment (financial and operational)
    6. Strategic direction and execution capability
    7. Key risks and opportunities
    8. Future outlook and scenarios
    9. Strategic options and potential recommendation areas
    10. Alignment between internal and external perspectives
    11. Areas of consensus and disagreement in perspectives
    

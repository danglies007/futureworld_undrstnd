# internal_tasks.yaml - internal_company_analysis_crew

analyze_annual_reports:
  description: >
    **GOAL**
    Analyse the most recent annual reports of the company: {company_name}, ticker symbol: {ticker_symbol}, the current date is {date}. Use this information to provide a comprehensive overall analysis of the company - based on internal company sources that cover the key focus areas below.
    
    **KEY FOCUS AREAS RELATING TO THE GOAL**
    1. Company overview and business description
    2. Business Model and Components
    3. Mission, vision, and values statements
    4. Business segments and their performance
    5. Strategic priorities and initiatives
    6. Risk factors identified by the company
    7. Highlights from Leadership statements (CEO, Chairman, etc.)
    8. Forward-looking statements and future outlook
    9. Management's discussion and analysis

    **MANDATORY WORKFLOW:**
    1. Think carefully about your goal and ensure you cover all key focus areas.
    2. You have access to several tools - use these as required to complete your task effectively.
    
    3. INITIAL DISCOVERY AND NAVIGATION:
        a. Navigate to the company's website using NavigateTool:
          ```json
          {
            "url": "https://www.google.com/search?q={company_name}+official+website",
            "wait_for": ".g",
            "browser_type": "chromium",
            "headless": true
          }
          ```
          
        b. After finding the company website, navigate to it and take a screenshot:
          ```json
          {
            "url": "[company_website_url]",
            "path": "company_homepage.png",
            "wait_for": "body"
          }
          ```
          
        c. Find and navigate to the investor relations section:
          ```json
          {
            "url": "https://www.google.com/search?q={company_name}+investor+relations",
            "wait_for": ".g",
            "browser_type": "chromium"
          }
          ```
          
        d. Extract and document the investor relations page structure:
          ```json
          {
            "url": "[investor_relations_url_from_search]",
            "selector": "body",
            "extract_type": "html",
            "wait_for": "body"
          }
          ```
          
        e. Take a screenshot of the investor relations page:
          ```json
          {
            "url": "[investor_relations_url]",
            "path": "investor_relations_page.png",
            "wait_for": "body"
          }
          ```
    
    4. LOCATING ANNUAL REPORTS:
        a. Use WebInteractionTool to navigate through the investor relations site:
          ```json
          {
            "url": "[investor_relations_url]",
            "actions": [
              {"type": "extract_text", "selector": "nav, .menu, header, a"},
              {"type": "evaluate", "javascript": `
                const links = Array.from(document.querySelectorAll('a'));
                return links.filter(link => {
                  const text = (link.textContent || '').toLowerCase();
                  return text.includes('annual report') || 
                          text.includes('financial report') || 
                          text.includes('10-k') ||
                          text.includes('financial') ||
                          text.includes('reports');
                }).map(link => ({
                  text: link.textContent.trim(),
                  href: link.href
                }));
              `}
            ]
          }
          ```
          
        b. Navigate to reports page and take screenshot:
          ```json
          {
            "url": "[financial_reports_url]",
            "path": "financial_reports_page.png",
            "wait_for": ".reports, table, .filings, .documents"
          }
          ```
    
    5. ACCESSING SEC FILINGS:
        a. Navigate to the SEC EDGAR database:
          ```json
          {
            "url": "https://www.sec.gov/edgar/searchedgar/companysearch",
            "browser_type": "chromium",
            "wait_for": "form"
          }
          ```
          
        b. Search for company filings using WebInteractionTool:
          ```json
          {
            "url": "https://www.sec.gov/edgar/searchedgar/companysearch",
            "actions": [
              {"type": "type", "selector": "input#company", "text": "{ticker_symbol}"},
              {"type": "click", "selector": "button[type='submit']"},
              {"type": "wait", "selector": "table.tableFile"},
              {"type": "screenshot", "path": "sec_search_results.png"},
              {"type": "evaluate", "javascript": `
                return Array.from(document.querySelectorAll('tr')).filter(row => 
                  row.textContent.includes('10-K') || row.textContent.includes('Annual Report')
                ).slice(0, 3).map(row => {
                  const cells = Array.from(row.querySelectorAll('td'));
                  return {
                    type: cells[0]?.textContent.trim(),
                    date: cells[1]?.textContent.trim(),
                    link: cells[2]?.querySelector('a')?.href
                  };
                });
              `}
            ]
          }
          ```
    
    6. EXTRACTION OF KEY FOCUS AREAS:
        
        a. Company Overview and Business Description:
          ```json
          {
            "url": "[company_profile_url]",
            "actions": [
              {"type": "extract_text", "selector": "section:contains('About'), div:contains('Overview'), .company-profile, .about-us"},
              {"type": "screenshot", "path": "company_overview.png"},
              {"type": "evaluate", "javascript": `
                const sections = [
                  ...document.querySelectorAll('h1, h2, h3, h4, h5, h6'),
                ].filter(h => 
                  h.textContent.toLowerCase().includes('about') || 
                  h.textContent.toLowerCase().includes('overview') || 
                  h.textContent.toLowerCase().includes('profile') ||
                  h.textContent.toLowerCase().includes('company')
                );
                
                return sections.map(section => {
                  let content = '';
                  let element = section.nextElementSibling;
                  
                  while (element && !['H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(element.tagName)) {
                    content += element.textContent + ' ';
                    element = element.nextElementSibling;
                  }
                  
                  return {
                    heading: section.textContent.trim(),
                    content: content.trim()
                  };
                });
              `}
            ]
          }
          ```
          
        b. Business Model and Components:
          ```json
          {
            "url": "[business_model_url]",
            "actions": [
              {"type": "extract_text", "selector": "section:contains('Business Model'), div:contains('Model'), .business-model"},
              {"type": "screenshot", "path": "business_model.png"},
              {"type": "evaluate", "javascript": `
                const modelElements = document.querySelectorAll('.business-model, section:contains("Business Model"), div:contains("Model")');
                const modelTexts = Array.from(modelElements).map(el => el.textContent.trim());
                return { businessModelTexts: modelTexts };
              `}
            ]
          }
          ```
          
        c. Mission, Vision and Values:
          ```json
          {
            "url": "[about_page_url]",
            "actions": [
              {"type": "extract_text", "selector": ".mission, .vision, .values, section:contains('Mission'), section:contains('Vision'), section:contains('Values')"},
              {"type": "screenshot", "path": "mission_vision_values.png"},
              {"type": "evaluate", "javascript": `
                const findSection = (keyword) => {
                  const elements = Array.from(document.querySelectorAll('h1, h2, h3, h4, p, div, section'));
                  const section = elements.find(el => 
                    el.textContent.toLowerCase().includes(keyword.toLowerCase())
                  );
                  
                  if (!section) return null;
                  
                  // Get the parent section or the element itself
                  const sectionElement = section.closest('section') || section;
                  return sectionElement.textContent.trim();
                };
                
                return {
                  mission: findSection('mission'),
                  vision: findSection('vision'),
                  values: findSection('values')
                };
              `}
            ]
          }
          ```
          
        d. Business Segments and Performance:
          ```json
          {
            "url": "[segments_url]",
            "actions": [
              {"type": "extract_text", "selector": ".segments, section:contains('Segment'), table:contains('Segment')"},
              {"type": "screenshot", "path": "business_segments.png"},
              {"type": "evaluate", "javascript": `
                // Try to find segment tables
                const tables = Array.from(document.querySelectorAll('table'));
                const segmentTables = tables.filter(table => 
                  table.textContent.toLowerCase().includes('segment') || 
                  table.textContent.toLowerCase().includes('division') ||
                  table.textContent.toLowerCase().includes('business unit')
                );
                
                const extractTableData = (table) => {
                  const headers = Array.from(table.querySelectorAll('th')).map(th => th.textContent.trim());
                  const rows = Array.from(table.querySelectorAll('tr')).slice(1);
                  
                  return {
                    headers,
                    data: rows.map(row => {
                      const cells = Array.from(row.querySelectorAll('td')).map(td => td.textContent.trim());
                      return headers.reduce((obj, header, i) => {
                        obj[header] = cells[i] || '';
                        return obj;
                      }, {});
                    })
                  };
                };
                
                // Also look for descriptive text about segments
                const segmentDescriptions = Array.from(document.querySelectorAll('p, div, section')).filter(el => 
                  el.textContent.toLowerCase().includes('segment') || 
                  el.textContent.toLowerCase().includes('division')
                ).map(el => el.textContent.trim());
                
                return {
                  tables: segmentTables.map(extractTableData),
                  descriptions: segmentDescriptions
                };
              `}
            ]
          }
          ```
          
        e. Strategic Priorities and Initiatives:
          ```json
          {
            "url": "[strategy_url]",
            "actions": [
              {"type": "extract_text", "selector": ".strategy, section:contains('Strategy'), section:contains('Priorities'), .priorities, .initiatives"},
              {"type": "screenshot", "path": "strategic_priorities.png"},
              {"type": "evaluate", "javascript": `
                const strategyElements = document.querySelectorAll('.strategy, section:contains("Strategy"), section:contains("Priorities"), .priorities, .initiatives');
                const strategyHeadings = Array.from(document.querySelectorAll('h1, h2, h3, h4, h5, h6')).filter(h => 
                  h.textContent.toLowerCase().includes('strategy') || 
                  h.textContent.toLowerCase().includes('priorities') ||
                  h.textContent.toLowerCase().includes('initiatives')
                );
                
                const strategyContents = strategyHeadings.map(heading => {
                  let content = '';
                  let element = heading.nextElementSibling;
                  
                  while (element && !['H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(element.tagName)) {
                    content += element.textContent + ' ';
                    element = element.nextElementSibling;
                  }
                  
                  return {
                    heading: heading.textContent.trim(),
                    content: content.trim()
                  };
                });
                
                return { 
                  strategies: strategyContents,
                  rawText: Array.from(strategyElements).map(el => el.textContent.trim())
                };
              `}
            ]
          }
          ```
          
        f. Risk Factors:
          ```json
          {
            "url": "[risk_url]",
            "actions": [
              {"type": "extract_text", "selector": ".risks, section:contains('Risk'), h2:contains('Risk') + *"},
              {"type": "screenshot", "path": "risk_factors.png"},
              {"type": "evaluate", "javascript": `
                // Look for risk headings and sections
                const riskHeadings = Array.from(document.querySelectorAll('h1, h2, h3, h4, h5, h6')).filter(h => 
                  h.textContent.toLowerCase().includes('risk')
                );
                
                // Look for list items that might be risks
                const riskListItems = Array.from(document.querySelectorAll('li')).filter(li => 
                  li.closest('section')?.textContent.toLowerCase().includes('risk') || 
                  li.closest('div')?.textContent.toLowerCase().includes('risk')
                ).map(li => li.textContent.trim());
                
                // Extract risk sections with context
                const riskSections = riskHeadings.map(heading => {
                  let content = '';
                  let element = heading.nextElementSibling;
                  
                  while (element && !['H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(element.tagName)) {
                    content += element.textContent + ' ';
                    element = element.nextElementSibling;
                  }
                  
                  return {
                    heading: heading.textContent.trim(),
                    content: content.trim()
                  };
                });
                
                return { 
                  riskSections: riskSections,
                  riskListItems: riskListItems
                };
              `}
            ]
          }
          ```
          
        g. Leadership Statements:
          ```json
          {
            "url": "[leadership_url]",
            "actions": [
              {"type": "extract_text", "selector": ".ceo-message, .chairman-letter, section:contains('Message'), section:contains('Letter')"},
              {"type": "screenshot", "path": "leadership_statements.png"},
              {"type": "evaluate", "javascript": `
                const leadershipHeadings = Array.from(document.querySelectorAll('h1, h2, h3, h4, h5, h6')).filter(h => 
                  h.textContent.toLowerCase().includes('ceo') || 
                  h.textContent.toLowerCase().includes('chairman') ||
                  h.textContent.toLowerCase().includes('message') ||
                  h.textContent.toLowerCase().includes('letter') ||
                  h.textContent.toLowerCase().includes('statement')
                );
                
                const leadershipStatements = leadershipHeadings.map(heading => {
                  let content = '';
                  let element = heading.nextElementSibling;
                  
                  while (element && !['H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(element.tagName)) {
                    content += element.textContent + ' ';
                    element = element.nextElementSibling;
                  }
                  
                  return {
                    heading: heading.textContent.trim(),
                    content: content.trim()
                  };
                });
                
                return { leadershipStatements: leadershipStatements };
              `}
            ]
          }
          ```
          
        h. Forward-Looking Statements and Outlook:
          ```json
          {
            "url": "[outlook_url]",
            "actions": [
              {"type": "extract_text", "selector": "section:contains('Outlook'), h2:contains('Future') + *, .forward-looking"},
              {"type": "screenshot", "path": "future_outlook.png"},
              {"type": "evaluate", "javascript": `
                // Find sections with outlook or forward-looking content
                const outlookHeadings = Array.from(document.querySelectorAll('h1, h2, h3, h4, h5, h6')).filter(h => 
                  h.textContent.toLowerCase().includes('outlook') || 
                  h.textContent.toLowerCase().includes('future') ||
                  h.textContent.toLowerCase().includes('forward') ||
                  h.textContent.toLowerCase().includes('growth')
                );
                
                // Extract content from those sections
                const outlookSections = outlookHeadings.map(heading => {
                  let content = '';
                  let element = heading.nextElementSibling;
                  
                  while (element && !['H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(element.tagName)) {
                    content += element.textContent + ' ';
                    element = element.nextElementSibling;
                  }
                  
                  return {
                    heading: heading.textContent.trim(),
                    content: content.trim()
                  };
                });
                
                // Also look for paragraphs with forward-looking language
                const forwardPhrases = ['expect', 'anticipate', 'future', 'plan', 'will', 'strategy', 'growth', 'target', 'goal'];
                const forwardLookingParagraphs = Array.from(document.querySelectorAll('p')).filter(p => 
                  forwardPhrases.some(phrase => p.textContent.toLowerCase().includes(phrase))
                ).map(p => p.textContent.trim());
                
                return { 
                  outlookSections: outlookSections,
                  forwardLookingStatements: forwardLookingParagraphs
                };
              `}
            ]
          }
          ```
          
        i. Management's Discussion and Analysis:
          ```json
          {
            "url": "[mda_url]",
            "actions": [
              {"type": "extract_text", "selector": "section:contains('Management'), section:contains('MD&A'), section:contains('Discussion and Analysis')"},
              {"type": "screenshot", "path": "management_discussion.png"},
              {"type": "evaluate", "javascript": `
                // Find Management Discussion & Analysis sections
                const mdaHeadings = Array.from(document.querySelectorAll('h1, h2, h3, h4, h5, h6')).filter(h => 
                  h.textContent.toLowerCase().includes('management') || 
                  h.textContent.toLowerCase().includes('md&a') ||
                  h.textContent.toLowerCase().includes('discussion and analysis')
                );
                
                // Extract content from MD&A sections
                const mdaSections = mdaHeadings.map(heading => {
                  let content = '';
                  let element = heading.nextElementSibling;
                  
                  while (element && !['H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(element.tagName)) {
                    content += element.textContent + ' ';
                    element = element.nextElementSibling;
                  }
                  
                  return {
                    heading: heading.textContent.trim(),
                    content: content.trim()
                  };
                });
                
                // Look for tables in MD&A sections
                const tables = Array.from(document.querySelectorAll('table')).filter(table => 
                  table.closest('section')?.textContent.toLowerCase().includes('management') || 
                  table.closest('div')?.textContent.toLowerCase().includes('management')
                );
                
                const extractTableData = (table) => {
                  const headers = Array.from(table.querySelectorAll('th')).map(th => th.textContent.trim());
                  const rows = Array.from(table.querySelectorAll('tr')).slice(1);
                  
                  return {
                    headers,
                    data: rows.map(row => {
                      const cells = Array.from(row.querySelectorAll('td')).map(td => td.textContent.trim());
                      return headers.reduce((obj, header, i) => {
                        obj[header] = cells[i] || '';
                        return obj;
                      }, {});
                    })
                  };
                };
                
                return { 
                  mdaSections: mdaSections,
                  tables: tables.map(extractTableData)
                };
              `}
            ]
          }
          ```
    
    7. PDF HANDLING:
        a. For PDF annual reports, follow this workflow:
          - First use NavigateTool to find the PDF links:
            ```json
            {
              "url": "[investor_relations_url]",
              "wait_for": "a[href$='.pdf'], a:contains('Annual Report'), a:contains('10-K')",
              "browser_type": "chromium"
            }
            ```
          
          - Then use WebInteractionTool to extract PDF links:
            ```json
            {
              "url": "[investor_relations_url]",
              "actions": [
                {"type": "evaluate", "javascript": `
                  return Array.from(document.querySelectorAll('a[href$=".pdf"], a[href*="annual"], a[href*="report"]')).map(a => ({
                    text: a.textContent.trim(),
                    href: a.href
                  })).filter(link => 
                    link.text.toLowerCase().includes('annual') || 
                    link.text.toLowerCase().includes('report') || 
                    link.text.toLowerCase().includes('10-k')
                  );
                `}
              ]
            }
            ```
          
          - Take a screenshot of the PDF link page:
            ```json
            {
              "url": "[pdf_links_page]",
              "path": "pdf_links_page.png",
              "wait_for": "a[href$='.pdf'], a:contains('Annual Report')"
            }
            ```
          
          - For each PDF URL found, download using FileDownloaderTool:
            ```
            Action: Download File Tool
            Action Input:
            url: [pdf_url_with_query_params_removed]
            ```
          
          - Use the RagTool to search the PDF content for each key focus area:
            ```
            Action: Search a PDF's content tool
            Action Input:
            pdf: reference/[EXTRACTED_FILENAME]
            query: "business model" OR "company overview"
            ```
    
    8. CURRENCY CONVERSION (when needed):
        a. If financial data is in non-USD currency, use CodeInterpreterTool to convert:
          ```
          import requests
          
          def convert_currency(amount, from_currency, to_currency='USD', date=None):
              # Use a default exchange rate if API is not available
              # For actual implementation, you would use a currency API
              exchange_rates = {
                  'EUR': 1.08,
                  'GBP': 1.27,
                  'JPY': 0.0066,
                  'AUD': 0.65,
                  'CAD': 0.73,
                  # Add other currencies as needed
              }
              
              if from_currency == to_currency:
                  return amount
              
              rate = exchange_rates.get(from_currency)
              if rate:
                  return amount * rate
              else:
                  return f"Could not convert "from_currency" to "to_currency""
                  
          # Example usage
          convert_currency(100, 'EUR')  # Convert 100 EUR to USD
          ```

    **FINAL OUTPUT REQUIREMENTS:**
    1. Compile results into an "Annual Report Analysis" aligned to the AnnualReportAnalysisResult schema in JSON format.
    2. Include references to screenshots taken when discussing visual elements like charts or organizational structures.
    3. Your analysis should:
        - Incorporate real information and data from the tools.
        - Be exhaustive and address all key focus areas.
        - Use a first-principles approach to evaluate the positioning of the business from an internal perspective.
        - Focus on data and performance specific to the year {year}, with trends over the period: {time_period}
    4. If you cannot find information for a field, do not make it up or fabricate information, instead leave it empty or make a comment.
    5. Always provide clear attribution and inline citation for all information extracted from sources.

    **QUALITY REQUIREMENTS:**
    1. **NEVER FABRICATE INFORMATION**
    2. **PROVIDE REAL WORKING URLS FOR ALL SOURCES**
    3. **NEVER GENERATE YOUR OWN PDF FILE NAME TO DOWNLOAD**
    4. **NEVER PASS A FULL PDF TO THE MODEL**
    5. **USE SCREENSHOTS STRATEGICALLY**:
        - Take screenshots of important source pages for documentation
        - Capture visual elements like charts, tables, and organizational structures
        - Use screenshots as evidence of your research process
        - Reference screenshots in your analysis when discussing visual data

    **ADVANCED PLAYWRIGHT STRATEGIES:**
    1. **For Interactive Reports:**
        - Many companies now use interactive annual reports with tabs and dynamic content
        - Use click actions to navigate through these elements before extraction
        - Take screenshots of each main section for documentation
    
    2. **For Data Verification:**
        - Take screenshots of original data sources to verify extracted text
        - Use visual evidence alongside textual data in your analysis
    
    3. **For Handling Authentication:**
        - If you encounter login walls, try finding alternative public sources
        - Consider SEC EDGAR as a reliable source for regulatory filings
        - Document any access limitations with screenshots
    
    4. **For Complex Tables:**
        - Use JavaScript evaluation to properly structure financial tables
        - Take screenshots of complex tables for visual reference
        - Verify data extraction by cross-checking text and visual elements
  guardrail: >
    Make sure each of the key focus areas has been covered and that the analysis is comprehensive and accurate.
  expected_output: >
    An "Annual Report Analysis" for {company_name}, aligned to the AnnualReportAnalysisResult object containing accurate, detailed and correctly cited information extracted from the company's own sources (e.g. annual reports, financial statements, investor presentations, etc).
  agent: annual_report_analyzer


analyze_financial_statements:
  description: >
    **GOAL**
    Analyse the most recent financial report and statements of the company: {company_name}, the current date is {date}.  Use this information to provide a comprehensive overall analysis of the company that covers the key focus areas below.
    
    **KEY FOCUS AREAS RELATING TO THE GOAL**
    1. Financial Metrics relevant to the company and industry
    2. Capital allocation including description, % usage trends etc.
    3. Segment performance

    **MANDATORY WORKFLOW:**
    1. Think carefully about your goal and key focus areas and plan your approach to achieve it.
    2. You have access to a number of tools in order to achieve your goal, use these tools as required to complete your task.  Guidelines on your tools and how to use them are included in the "TOOLS" section below.
    3. Find potential sources using the search the internet tool to search for the company's investor relations pages and official websites.
    4. From these sources:
        - If you need to extract information from a website, use the read website content tool.
        - If you need to look for information in a PDF or a link to a PDF, NEVER try to read the PDF content into the model, Download the PDF file using the "Download File tool", and use the "Search a PDF's content" tool to find relevant content.
    5. For each focus area, conduct multiple searches with different queries to ensure comprehensive extraction - ensure you cover all relevant information and provide clear and accurate attribution and citationsfor all information extracted.
    6. Ensure you are completly exhaustive when extracting content, do not assume that only 1 or 2 instances of some information exists e.g. strategic priorities, or business segments etc.  Continue to search the sources until you are completly exhaustive.
    7. Find and Cross-reference information across multiple years to identify trends and changes.
    8. Prioritise information from the most recent sources.
    9. If numbers are provided in local currency, provide both the local currency and a converted value in USD - Ensure you provide the currency conversion rate used in the conversion.
    10. If you need to convert currecies you can use the Code Interpreter tool to write simple code to convert the currency from local currency to USD.

    **FINAL OUTPUT REQUIREMENTS:**
    1. Compile results into a "Financial Analysis" aligned to the FinancialAnalysisResult schema in JSON format.
    2. If you cannot find information for a field, do not make it up or fabricate information instead leave it empty or make a comment in the field explaining why you cannot find the information.
    3. Always provide clear attribution and inline citation for all information extracted from sources.

    **QUALITY REQUIREMENTS:**
    1. **NEVER FABRICATE INFORMATION**
        - only use content from your sources with clear attribution and citation.
        - if you cannot find information for a field, do not make it up or fabricate information instead leave it empty or make a comment in the field explaining why you cannot find the information.
    2. **PROVIDE REAL WORKING URLS FOR ALL SOURCES - DO NOT PROVIDE FAKE OR MOCKED SOURCES**
    3. **NEVER GENERATE YOUR OWN PDF FILE NAME TO DOWNNLOAD - only download and use actual PDF files or documents.**
    4. **NEVER PASS A FULL PDF TO THE MODEL - use the download file tool to download the PDF and then use the search a PDF's content tool to only pass the relevant content of the PDF to the model.**

    **TOOLS**
    You have access to these tools should you need them:
    1. Brave Search tool: If you need to search the internet to find potential sources, use the Brave Search tool
    2. Scrape Website tool: If you need to extract specific information from a website source, use the Scrape Website tool in order to read the details of the website.
    3. Code Interpreter tool: 
        If you need to convert currecies you can use the Code Interpreter tool to write simple code to convert the currency from local currency to USD.
        If you need to perform calculations you can use the Code Interpreter tool to write simple code to perform the calculation.
    4. Search PDF tool: If you need to look for information in a PDF or a link to a PDF, NEVER try to read the PDF content into the model, Download the PDF file using the "Download File tool", and use the "Search a PDF's content" tool to find relevant content.
    5. Download File tool: If you need to download a file, use the Download File tool:
        Action: Download File Tool
        Action Input:
        url: 
        For each download, confirm success and extract the filename:
        "Successfully downloaded file: [filename]"

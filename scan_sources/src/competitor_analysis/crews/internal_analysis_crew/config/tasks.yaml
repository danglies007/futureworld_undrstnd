# internal_tasks.yaml - internal_company_analysis_crew

identify_company_internal_sources:
  description: >
    You will identify and evaluate the most relevant internal sources for analyzing {company_name}.  Focus on recent sources, the date is {date}.
    
    Focus on finding the following types of documents:
    1. Most recent annual reports (last 3 years if available), considering the current date is: {date}
    2. Financial statements and earnings releases
    3. Investor presentations and transcripts
    4. Corporate governance documents
    5. Sustainability/ESG reports
    6. Product and service documentation
    
    For each source identified:
    - Assess relevance to understanding the company comprehensively
    - Evaluate quality and credibility
    - Check accessibility (avoid paywalled or restricted content)
    - Determine recency (prioritize more recent documents)
    
    **MANDATORY WORKFLOW:**
    1. First, search for the company's investor relations pages and official websites
    2. Identify the most recent annual report as a priority
    3. Expand search to include other relevant internal documents
    4. For each document, extract or infer:
       - Document title
       - Publication date
       - Document type
       - URL
       - Brief description of content
    5. Clean each URL by removing query parameters (everything after '?' character) and fragments (everything after '#' character)
    6. Score each document for relevance on a scale of 1-10
    7. Organize results by document type and recency
    8. Do not fabricate any sources or links to documents, if you cannot find a source, do not include it in the list

    **URL Cleaning Rules:**
    1. Remove query strings (parameters after '?' in URLs)
    2. Remove fragments (everything after '#' in URLs)
    3. Only keep the base URL path to the document
    4. Example: 
       - Original: https://www.example.com/document.pdf?view=1&lang=en#page=2
       - Cleaned: https://www.example.com/document.pdf


    **Quality requirements:**
    1. **NEVER FABRICATE INFORMATION - only use content from the provided sources.**
    2. **PROVIDE REAL WORKING URLS FOR ALL SOURCES - DO NOT PROVIDE FAKE OR MOCKED SOURCES**

    **Final Output:**
    Compile results into a CompanySourceIdentificationResults object containing:
    - Internal sources categorized by type
    - Relevant metadata for each source (with cleaned URLs)
    - Overall assessment of the document collection

  expected_output: >
    A CompanySourceIdentificationResults object containing detailed information about the internal company sources identified for analysis, with all URLs properly cleaned.
  agent: company_source_identifier

analyze_annual_reports:
  description: >
    You will receive a list of internal company sources identified by the company_source_identifier agent.
    Your job is to thoroughly analyze all sources relating to annual reports and extract structured information about {company_name}. Focus on the most recent sources first, the date is {date}.
    
    **MANDATORY ANALYSIS AREAS:**
    1. Company overview and business description
    2. Business segments and their performance
    3. Mission, vision, and values statements
    4. Management's discussion and analysis
    5. Strategic priorities and initiatives
    6. Risk factors identified by the company
    7. Forward-looking statements and future outlook
    8. Leadership statements (CEO, Chairman, etc.)
    
    **MANDATORY WORKFLOW:**
    1. Download each annual report PDF:
       Action: Download File Tool
       Action Input:
       url: [Use the actual URL from each annual report or investor presentation entry in the provided source list]
    
    2. For each download, confirm success and extract the filename:
       "Successfully downloaded file: [filename]"
    
    3. Search each PDF systematically:
       Action: Search a PDF's content
       Action Input:
       pdf: reference/[EXTRACTED FILENAME]
       query: [TARGETED SEARCH QUERY FOR EACH ANALYSIS AREA]
    
    4. For each analysis area, conduct multiple searches with different queries
       to ensure comprehensive extraction
    
    5. Structure extracted information using appropriate Pydantic models:
       - BusinessSegment for business units
       - StrategicPriority for strategic initiatives
       - RiskFactor for identified risks
       - AttributedItem for significant statements
    
    6. Cross-reference information across multiple years to identify trends and changes
    
    7. Pay special attention to changes in strategic priorities, risk assessments,
       and forward-looking statements over time

    8. Repeat steps 1 to 7 for each relevant source provided

    **Quality requirements:**
    1. NEVER FABRICATE INFORMATION - only use content from the provided sources.
    2. Confirm all sources have accurate attribution.
    3. Maintain proper citation throughout.

    **Final Output:**
    AnnualReportAnalysisResult object focusing on qualitative information extracted from annual reports, properly attributed to sources.

  expected_output: >
    An AnnualReportAnalysisResult object containing structured information extracted from the company's annual reports.
  agent: annual_report_analyzer

analyze_financial_statements:
  description: >
    You will receive a list of internal company sources identified by the company_source_identifier agent.
    Your job is to analyze all financial statements and financial sections of annual reports to extract structured financial information about {company_name}. Focus on recent sources, the date is {date}.
    
    **MANDATORY ANALYSIS AREAS:**
    1. Key financial metrics and their trends (revenue, profit, margins, etc.)
    2. Balance sheet analysis (assets, liabilities, equity structure)
    3. Cash flow analysis (operating, investing, financing activities)
    4. Capital allocation (dividends, share repurchases, capex, acquisitions)
    5. Segment financial performance
    6. Financial ratios (profitability, efficiency, leverage, liquidity)
    7. Management financial targets and performance against targets
    
    **MANDATORY WORKFLOW:**
    1. Download each financial statement or annual report PDF:
       Action: Download File Tool
       Action Input:
       url: [financial statement URL from internal_sources where source_type = "Financial Statements"]
    
    2. For each download, confirm success and extract the filename:
       "Successfully downloaded file: [filename]"
    
    3. Search each PDF systematically for financial information:
       Action: Search a PDF's content
       Action Input:
       pdf: reference/[EXTRACTED FILENAME]
       query: [TARGETED SEARCH QUERY FOR EACH FINANCIAL AREA]
    
    4. Extract numerical data for at least the past 3 years when available
    
    5. Structure financial information using FinancialMetric models
    
    6. Calculate growth rates, trends, and significant changes
    
    7. Analyze capital allocation patterns and priorities
    
    8. Compare financial performance across business segments

    9. Repeat steps 1 to 8 for each relevant source provided

    **CRITICAL DATA STRUCTURE REQUIREMENTS:**
    1. The `financial_metrics` field MUST be structured as a list of FinancialMetricCategory objects where:
       - Each object has a `category_name` string (e.g., "Profitability", "Liquidity", "Growth", "Efficiency")
       - Each object has a `metrics` field containing a list of FinancialMetric objects related to that category
       - Example structure:
         ```
         "financial_metrics": [
           { 
             "category_name": "Profitability", 
             "metrics": [
               { "metric_name": "Operating Margin", "unit": "%", "current_value": 15.2, ... },
               { "metric_name": "Net Profit Margin", "unit": "%", "current_value": 8.7, ... }
             ]
           },
           { 
             "category_name": "Liquidity", 
             "metrics": [
               { "metric_name": "Current Ratio", "unit": "ratio", "current_value": 1.8, ... },
               { "metric_name": "Quick Ratio", "unit": "ratio", "current_value": 1.2, ... }
             ]
           }
         ]
         ```
       - If there are no metrics in a category, use an empty array for the metrics field: `"metrics": []`
    

    **Quality requirements:**
    1. NEVER FABRICATE INFORMATION - only use content from the provided sources.
    2. Confirm all sources have accurate attribution.
    3. Maintain proper citation throughout.
    4. Ensure correct data structures for all fields, especially financial_metrics.

    **Final Output:**
    FinancialAnalysisResult object focusing on financial metrics and capital allocation, properly attributed to sources.

  expected_output: >
    A FinancialAnalysisResult object containing structured financial information extracted from the company's financial statements, with financial_metrics organized as a dictionary of categories mapping to lists of metrics.
  agent: financial_statement_analyst

analyze_strategy_documents:
  description: >
    You will receive a list of internal company sources identified by the company_source_identifier agent.
    Your job is to analyze all strategy-related documents and strategic sections of annual reports to extract structured information about {company_name}'s strategy. Focus on recent sources, the date is {date}.
    
    **MANDATORY ANALYSIS AREAS:**
    1. Business model description and evolution
    2. Strategic priorities and initiatives
    3. Innovation focus and R&D investments
    4. Market positioning statements
    5. Competitive advantage claims
    6. Growth strategies (organic vs. inorganic)
    7. Digital transformation efforts
    8. ESG/Sustainability strategy
    
    **MANDATORY WORKFLOW:**
    1. Download each strategy document or annual report PDF:
       Action: Download File Tool
       Action Input: 
       url: [Use the actual URL from each strategy document or annual report entry in the provided source list]
    
    2. For each download, confirm success and extract the filename:
       "Successfully downloaded file: [filename]"
    
    3. Search each PDF systematically for strategy information:
       Action: Search a PDF's content
       Action Input:
       pdf: reference/[EXTRACTED FILENAME]
       query: [TARGETED SEARCH QUERY FOR EACH STRATEGY AREA]
    
    4. For each strategy area, conduct multiple searches with different queries to ensure comprehensive extraction
    
    5. Structure extracted information using appropriate Pydantic models:
       - StrategicPriority for strategic initiatives
       - BusinessModelComponent for business model elements
       - AttributedItem for significant statements about strategy
    
    6. Cross-reference information across multiple documents to identify consistencies and inconsistencies in stated strategy
    
    7. Pay special attention to how the company describes its competitive advantages and market positioning

    8. Repeat steps 1 to 7 for each relevant source provided

    **Quality requirements:**
    1. NEVER FABRICATE INFORMATION - only use content from the provided sources.
    2. Confirm all sources have accurate attribution.
    3. Maintain proper citation throughout.

    **Final Output:**
    StrategyAnalysisResult object focusing on strategy and business model information, properly attributed to sources.

  expected_output: >
    A StrategyAnalysisResult object containing structured strategy information extracted from the company's strategic documents.
  agent: strategy_document_analyst

consolidate_internal_analysis:
  description: >
    You will receive different analysis results from multiple analyst agents:
    - AnnualReportAnalysisResult from the annual_report_analyzer 
    - FinancialAnalysisResult from the financial_statement_analyst
    - StrategyAnalysisResult from the strategy_document_analyst
    Your job is to integrate these analyses into a comprehensive, cohesive internal company analysis that presents a complete picture of {company_name} from its own perspective. The current date is {date}.
    
    **MANDATORY INTEGRATION AREAS:**
    1. Create a unified company overview combining business description, segments, and model
    2. Synthesize strategic priorities across all documents
    3. Connect financial performance to stated strategic objectives
    4. Identify alignment or misalignment between strategic statements and financial allocation
    5. Create a comprehensive view of risk factors and mitigation strategies
    6. Develop an integrated assessment of the company's future outlook
    7. Identify key strengths and challenges based on internal documents
    
    **MANDATORY WORKFLOW:**
    1. Review all analysis results:
       - AnnualReportAnalysisResult from annual_report_analyzer
       - FinancialAnalysisResult from financial_statement_analyst
       - StrategyAnalysisResult from strategy_document_analyst
    
    2. Extract company overview, business segments, strategic priorities, and risk factors from the AnnualReportAnalysisResult
       
    3. Extract financial_performance and capital_allocation from the 
       FinancialAnalysisResult
       
    4. Supplement strategic priorities from the StrategyAnalysisResult and use it to enhance the business model description


    5. For each integration area, combine information from all sources while avoiding duplication
    
    6. Resolve any contradictions or inconsistencies across different documents, noting where these occur
    
    7. Prioritize information from more recent documents when there are conflicts or updates to strategy
    
    8. Identify key themes and patterns across all internal documents
    
    9. Create cross-connections between strategic priorities, financial metrics, and business segments
    
    10. Develop a summary analysis that captures the essence of the company's internal narrative

    **Quality requirements:**
    1. NEVER FABRICATE INFORMATION - only use content from the provided sources.
    2. Confirm all sources have accurate attribution.
    3. Maintain proper citation throughout.

    **Final Output:**
    Complete CompanyInternalAnalysis object that integrates all partial analyses into a comprehensive internal view of the company.
    
    Note: This consolidated analysis represents how the company portrays itself through official documents, not necessarily an objective assessment of its true position or performance.

  expected_output: >
    A complete CompanyInternalAnalysis object containing a comprehensive,
    integrated analysis of the company based on internal sources.
  agent: internal_analysis_consolidator
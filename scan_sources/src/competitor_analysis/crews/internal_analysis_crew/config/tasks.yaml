          "url": "https://financial-times.com/example-corp-analysis",
          "title": "Market Analysis: Example Corp's Growth Strategy",
          "source_type": "news_article",
          "publication_date": "2025-05-01",
          "author": "Financial Times",
          "relevance_score": 0.82,
          "summary": "Analysis of the company's expansion plans and market positioning."
        },
        {
          "url": "https://industry-analyst.com/reports/example-corp",
          "title": "Industry Competitive Report: Example Corp",
          "source_type": "analyst_report",
          "publication_date": "2025-04-22",
          "author": "Industry Analyst Group",
          "relevance_score": 0.91,
          "summary": "Detailed competitive analysis comparing Example Corp to industry peers."
        }
      ]
    }
    Using the "url" fields from the "internal_sources" in the list, thoroughly analyze the sources relating to financial statements and financial information (in the "source_type" field) and extract structured information aligned to the FinancialStatementAnalysisResult object about {company_name}. Focus on the most recent sources (based on the "publication_date" field) first, the date is {date}.
    
    **MANDATORY ANALYSIS AREAS:**
    1. Key financial metrics and their trends (revenue, profit, margins, etc.)
    2. Balance sheet analysis (assets, liabilities, equity structure)
    3. Cash flow analysis (operating, investing, financing activities)
    4. Capital allocation (dividends, share repurchases, capex, acquisitions)
    5. Segment financial performance
    6. Financial ratios (profitability, efficiency, leverage, liquidity)
    7. Management financial targets and performance against targets
    
    **MANDATORY WORKFLOW:**
    1. Based on the URL provided, download each financial statement or annual report PDF:
       Action: Download File Tool
       Action Input:
       url: 
    
    2. For each download, confirm success and extract the filename:
       "Successfully downloaded file: [filename]"
    
    3. Search each PDF systematically for financial information:
       Action: Search a PDF's content
       Action Input:
       pdf: reference/[EXTRACTED FILENAME]
       query: [TARGETED SEARCH QUERY FOR EACH FINANCIAL AREA]
    
    4. Extract numerical data for at least the past 3 years when available
    
    5. Structure financial information using FinancialMetric models
    
    6. Calculate growth rates, trends, and significant changes
    
    7. Analyze capital allocation patterns and priorities
    
    8. Compare financial performance across business segments

    9. Make sure you clean any URL by removing query parameters (everything after '?' character) and fragments (everything after '#' character)
    **URL Cleaning Rules:**
      1. Remove query strings (parameters after '?' in URLs)
      2. Remove fragments (everything after '#' in URLs)
      3. Only keep the base URL path to the document
      4. Example: 
        - Original: https://www.example.com/document.pdf?view=1&lang=en#page=2
        - Cleaned: https://www.example.com/document.pdf

    10. Repeat steps 1 to 9 for each annual report relevant url from the internal_sources field in the list provided

    **CRITICAL DATA STRUCTURE REQUIREMENTS:**
    1. The `financial_metrics` field MUST be structured as a list of FinancialMetricCategory objects where:
       - Each object has a `category_name` string (e.g., "Profitability", "Liquidity", "Growth", "Efficiency")
       - Each object has a `metrics` field containing a list of FinancialMetric objects related to that category
       - Example structure:
         ```
         "financial_metrics": [
           { 
             "category_name": "Profitability", 
             "metrics": [
               { "metric_name": "Operating Margin", "unit": "%", "current_value": 15.2, ... },
               { "metric_name": "Net Profit Margin", "unit": "%", "current_value": 8.7, ... }
             ]
           },
           { 
             "category_name": "Liquidity", 
             "metrics": [
               { "metric_name": "Current Ratio", "unit": "ratio", "current_value": 1.8, ... },
               { "metric_name": "Quick Ratio", "unit": "ratio", "current_value": 1.2, ... }
             ]
           }
         ]
         ```
       - If there are no metrics in a category, use an empty array for the metrics field: `"metrics": []`
    

    **Quality requirements:**
    1. NEVER FABRICATE INFORMATION - only use content from the provided sources.
    2. NEVER GENERATE YOUR OWN PDF FILE NAME TO DOWNNLOAD - only download and use actual PDF files or documents.
    3. Confirm all sources have accurate attribution.
    4. Maintain proper citation throughout.
    5. Ensure correct data structures for all fields, especially financial_metrics.
    6. If the currency is not USD, provide both the original currency and the converted amount in USD, convert them to USD using the exchange rate at the time of the report, also indicate the exchange rate used and source.
    7. Do not pass all PDF content into the model, only pass the relevant content.  Use the pdf search tool to find relevant content.

    **Final Output:**
    FinancialAnalysisResult object focusing on financial metrics and capital allocation, properly attributed to sources.

    IMPORTANT: Your response must be in valid JSON format that matches the expected output schema.

  expected_output: >
    A "Financial Analysis" aligned to the FinancialAnalysisResult object containing structured financial information extracted from the company's financial statements, with financial_metrics organized as a dictionary of categories mapping to lists of metrics.
  agent: financial_statement_analyst


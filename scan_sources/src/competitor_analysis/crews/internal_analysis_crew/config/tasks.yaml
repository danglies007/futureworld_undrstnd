# internal_tasks.yaml - internal_company_analysis_crew

identify_company_internal_sources:
  description: >
    Identify and evaluate the most relevant internal sources for analyzing "{company_name}".  Focus on recent sources, the date is {date}.
    
    Focus on finding the following types of documents:
    1. Most recent annual reports (last 3 years if available), considering the current date is: {date}
    2. Financial statements and earnings releases
    3. Investor presentations and transcripts
    4. Corporate governance documents
    5. Sustainability/ESG reports
    6. Product and service documentation
    
    For each source identified:
    - Assess relevance to understanding the company comprehensively
    - Evaluate quality and credibility
    - Check accessibility (avoid paywalled or restricted content)
    - Determine recency (prioritize more recent documents)
    
    **MANDATORY WORKFLOW:**
    1. First, search for the company's investor relations pages and official websites
    2. Identify the most recent annual report as a priority
    3. Expand search to include other relevant internal documents
    4. For each document, extract or infer:
       - Document title
       - Publication date
       - Document type
       - URL
       - Brief description of content
    5. Clean each URL by removing query parameters (everything after '?' character) and fragments (everything after '#' character)
    6. Score each document for relevance on a scale of 1-10
    7. Organize results by document type and recency
    8. Do not fabricate any sources or links to documents, if you cannot find a source, do not include it in the list

    **URL Cleaning Rules:**
    1. Remove query strings (parameters after '?' in URLs)
    2. Remove fragments (everything after '#' in URLs)
    3. Only keep the base URL path to the document
    4. Example: 
       - Original: https://www.example.com/document.pdf?view=1&lang=en#page=2
       - Cleaned: https://www.example.com/document.pdf


    **Quality requirements:**
    1. **NEVER FABRICATE INFORMATION - only use content from the provided sources.**
    2. **PROVIDE REAL WORKING URLS FOR ALL SOURCES - DO NOT PROVIDE FAKE OR MOCKED SOURCES**
    3. **NEVER GENERATE YOUR OWN PDF FILE NAME TO DOWNNLOAD - only download and use actual PDF files or documents.**

    **Final Output:**
    Compile results into a CompanySourceIdentificationResults object containing:
    - Internal sources categorized by type
    - Relevant metadata for each source (with cleaned URLs)
    - Overall assessment of the document collection

    IMPORTANT: Your response must be in valid JSON format that matches the expected output schema.

  expected_output: >
    An "internal company sources" list of relevant sources aligned to the CompanySourceIdentificationResults object, containing detailed information about the internal company sources identified for analysis, with all URLs properly cleaned.
  agent: company_source_identifier

analyze_annual_reports:
  description: >
    You will receive a list sources from the identify_company_internal_sources task.  
    
    The list will be structured as follows:

    {
      "company_name": "Example Corp",
      "ticker_symbol": "EXMP",
      "industry": "Technology",
      "date_of_identification": "2025-05-15",
      "total_sources_found": 12,
      "internal_sources": [
        {
          "url": "https://example.com/annual-report-2024",
          "title": "Annual Report 2024",
          "source_type": "annual_report",
          "publication_date": "2024-12-31",
          "author": "Example Corp",
          "relevance_score": 0.95,
          "summary": "Comprehensive annual report covering financial performance and strategic initiatives."
        },
        {
          "url": "https://example.com/investor-presentation",
          "title": "Q1 2025 Investor Presentation",
          "source_type": "investor_presentation",
          "publication_date": "2025-04-15",
          "author": "Example Corp",
          "relevance_score": 0.87,
          "summary": "Quarterly presentation highlighting recent performance and future outlook."
        }
      ],
      "external_sources": [
        {
          "url": "https://financial-times.com/example-corp-analysis",
          "title": "Market Analysis: Example Corp's Growth Strategy",
          "source_type": "news_article",
          "publication_date": "2025-05-01",
          "author": "Financial Times",
          "relevance_score": 0.82,
          "summary": "Analysis of the company's expansion plans and market positioning."
        },
        {
          "url": "https://industry-analyst.com/reports/example-corp",
          "title": "Industry Competitive Report: Example Corp",
          "source_type": "analyst_report",
          "publication_date": "2025-04-22",
          "author": "Industry Analyst Group",
          "relevance_score": 0.91,
          "summary": "Detailed competitive analysis comparing Example Corp to industry peers."
        }
      ]
    }
    
    Using the "url" fields from the "internal_sources" in the list, thoroughly analyze the sources relating to annual reports (in the "source_type" field) and extract structured information aligned to the AnnualReportAnalysisResult object about {company_name}. Focus on the most recent sources (based on the "publication_date" field) first, the date is {date}.
    
    **MANDATORY ANALYSIS AREAS:**
    1. Company overview and business description
    2. Business segments and their performance
    3. Mission, vision, and values statements
    4. Management's discussion and analysis
    5. Strategic priorities and initiatives
    6. Risk factors identified by the company
    7. Forward-looking statements and future outlook
    8. Leadership statements (CEO, Chairman, etc.)
    
    **MANDATORY WORKFLOW:**
    1. Based on the URL provided, download each annual report PDF:
       Action: Download File Tool
       Action Input:
       url:
    
    2. For each download, confirm success and extract the filename:
       "Successfully downloaded file: [filename]"
    
    3. Search each PDF systematically:
       Action: Search a PDF's content
       Action Input:
       pdf: reference/[EXTRACTED FILENAME]
       query: [TARGETED SEARCH QUERY FOR EACH ANALYSIS AREA]
    
    4. For each analysis area, conduct multiple searches with different queries
       to ensure comprehensive extraction
    
    5. Structure extracted information using appropriate Pydantic models:
       - BusinessSegment for business units
       - StrategicPriority for strategic initiatives
       - RiskFactor for identified risks
       - AttributedItem for significant statements
    
    6. Cross-reference information across multiple years to identify trends and changes
    
    7. Pay special attention to changes in strategic priorities, risk assessments, and forward-looking statements over time

    8. Make sure you clean any URL by removing query parameters (everything after '?' character) and fragments (everything after '#' character)
    **URL Cleaning Rules:**
      1. Remove query strings (parameters after '?' in URLs)
      2. Remove fragments (everything after '#' in URLs)
      3. Only keep the base URL path to the document
      4. Example: 
        - Original: https://www.example.com/document.pdf?view=1&lang=en#page=2
        - Cleaned: https://www.example.com/document.pdf

    9. Repeat steps 1 to 8 for each annual report relevant url from the internal_sources field in the list provided

    **Quality requirements:**
    1. NEVER FABRICATE INFORMATION - only use content from the provided sources.
    2. NEVER GENERATE YOUR OWN PDF FILE NAME TO DOWNNLOAD - only download and use actual PDF files or documents.
    3. Confirm all sources have accurate attribution.
    4. Maintain proper citation throughout.
    5. If the currency is not USD, provide both the original currency and the converted amount in USD, convert them to USD using the exchange rate at the time of the report, also indicate the exchange rate used and source.
    6. Do not pass all PDF content into the model, only pass the relevant content.  Use the pdf search tool to find relevant content.

    **Final Output:**
    AnnualReportAnalysisResult object focusing on qualitative information extracted from annual reports, properly attributed to sources.

    IMPORTANT: Your response must be in valid JSON format that matches the expected output schema.

  expected_output: >
    An "Annual Report Analysis" aligned to the AnnualReportAnalysisResult object containing structured information extracted from the company's annual reports.
  agent: annual_report_analyzer



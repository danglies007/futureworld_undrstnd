consolidate_external_analysis:
  description: >
    You will receive different analysis results from multiple analyst agents:
      - NewsMediaAnalysisResult from the news_analyst
      - ExternalFinancialAnalysisResult from the financial_analyst
      - MarketPositionAnalysisResult from the market_position_analyst
    Your job is to integrate these analyses into a comprehensive a complete, comprehensive, cohesive external analysis of that presents a complete external view of {company_name}. The current date is {date}.
    
    **MANDATORY INTEGRATION AREAS:**
    1. Create a unified external perception narrative
    2. Synthesize market positioning and competitive assessment
    3. Connect news events to financial performance assessments
    4. Develop a comprehensive SWOT analysis from external perspectives
    5. Identify consensus views versus areas of disagreement among external sources
    6. Create an integrated assessment of external expectations for future performance
    7. Identify key external concerns and positive outlook factors
    
    **MANDATORY WORKFLOW:**
    1. Extract company perception, news highlights, and media sentiment from the NewsMediaAnalysisResult
    2. Extract financial performance metrics, analyst perspectives, and stock performance from the ExternalFinancialAnalysisResult
    3. Extract industry position, competitor assessments, and market trends from the MarketPositionAnalysisResult
    4. Create a unified SWOT analysis by combining insights from all three sources
    5. For each integration area, combine information from all sources while highlighting different external perspectives
    6. Identify areas of consensus across different external sources
    7. Highlight significant disagreements or contradictions in external assessments
    8. Develop a balanced synthesis that gives appropriate weight to different external viewpoints
    9. Structure the integrated analysis using appropriate Pydantic models, ensuring all elements are properly attributed to sources
    10. Create an executive summary that captures the essence of external perspectives on the company
    
    **Quality requirements:**
    1. NEVER FABRICATE INFORMATION - only use content from the provided sources.
    2. NEVER GENERATE YOUR OWN PDF FILE NAME TO DOWNNLOAD - only download and use actual PDF files or documents.
    3. Confirm all sources have accurate attribution.
    4. Maintain proper citation throughout.
    5. If the currency is not USD, provide both the original currency and the converted amount in USD, convert them to USD using the exchange rate at the time of the report, also indicate the exchange rate used and source.    

    **Final Output:**
    Complete CompanyExternalAnalysis object that integrates all
    analyses into a comprehensive external view of the company.
    
    Note: This consolidated analysis represents how the company is viewed
    by external observers, which may differ significantly from how the
    company presents itself in official documents.
   
    IMPORTANT: Your response must be in valid JSON format that matches the expected output schema.

  expected_output: >
    A complete "External Analysis" aligned to the CompanyExternalAnalysis object containing a comprehensive, integrated analysis of the company based on external sources.
  agent: external_analysis_consolidator
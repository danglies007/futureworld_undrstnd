consolidate_external_analysis:
  description: >

    **GOAL**
    You will integrate analysis results from multiple analyst agents into a comprehensive, cohesive external analysis that presents a complete external view of {company_name}, ticker symbol: {ticker_symbol}. The current date is {date}.
    
    **KEY FOCUS AREAS RELATING TO THE GOAL**
    1. Company perception - Overall external perception of the company
    2. Industry position - Position in the industry according to external sources
    3. Competitors - Assessment of key competitors
    4. Market trends - Relevant market trends
    5. Analyst perspectives - Perspectives from industry/financial analysts
    6. News highlights - Significant recent news
    7. Financial performance - Financial performance according to external sources
    8. Growth strategy assessment
    9. Organic growth statements
    10. Inorganic growth statements
    11. Acquisitions divestments
    12. SWOT analysis - SWOT analysis from external perspective
    13. Customer perception - How customers perceive the company
    14. ESG assessment - Environmental, Social, Governance assessment
    15. Sources analyzed - Sources analyzed for this external analysis
    16. Analysis summary - Summary of key findings from external analysis
    
    **MANDATORY WORKFLOW:**
    1. You will receive different analysis results from multiple analyst agents:
      - NewsMediaAnalysisResult from the news_analyst
      - ExternalFinancialAnalysisResult from the financial_analyst
      - MarketPositionAnalysisResult from the market_position_analyst
    2. Extract news related information and insights e.g. company perception, news highlights, and media sentiment from the NewsMediaAnalysisResult
    3. Extract financial related information and insights e.g. financial performance metrics, analyst perspectives, and stock performance from the ExternalFinancialAnalysisResult
    4. Extract market position related information and insights e.g. industry position, competitor assessments, and market trends from the MarketPositionAnalysisResult
    5. Create a unified SWOT analysis by combining insights from all sources
    6. For each area, combine information from all sources while highlighting different external perspectives
    7. Identify areas of consensus across different external sources
    8. Highlight significant disagreements or contradictions in external assessments
    9. Develop a balanced synthesis that gives appropriate weight to different external viewpoints
    10. Create an executive summary that captures the essence of external perspectives on the company    

    **FINAL OUTPUT REQUIREMENTS:**
    1. Compile results into an "External Analysis" aligned to the CompanyExternalAnalysis schema in JSON format.
    2. Your analysis should:
        - Incorporate real information and data from the tools.
        - Be exhaustive and address all key focus areas.
        - Use a first-principles approach to evaluate the positioniong of the business from an internal perspective.
        - Focus on data and performance specific to the year {year}. with trends over the period: {time_period}
    3. If you cannot find information for a field, do not make it up or fabricate information, instead leave it empty or make a comment in the field explaining why you cannot find the information.
    4. Always provide clear attribution and inline citation for all information extracted from sources.

    **QUALITY REQUIREMENTS:**
    1. **NEVER FABRICATE INFORMATION**
        - only use content from your sources with clear attribution and citation.
        - if you cannot find information for a field, do not make it up or fabricate information, instead leave it empty or make a comment in the field explaining why you cannot find the information.
    2. **DO NOT USE TRUSTPILOT AND SIMILAR SITES FOR OPINIONS AND ANALYSIS - RATHER USE REPUTABLE SOURCES OR REPORTS**

    Note: This consolidated analysis represents how the company is viewed by external observers, which may differ significantly from how the company presents itself in official documents.  


  expected_output: >
    A complete "External Analysis" for {company_name} aligned to the CompanyExternalAnalysis object containing a comprehensive, integrated analysis of the company based on external sources.
  agent: external_analysis_consolidator
analyze_news_and_media:
  description: >
    **GOAL**
    You will analyse news articles, media coverage, and public statements about {company_name}, ticker symbol: {ticker_symbol}, to identify significant events, trends in perception, and external assessments of the company. Focus on recent sources, the current date is {date}.
    
    **KEY FOCUS AREAS RELATING TO THE GOAL**
    1. Perception about the the company
    2. Key news highlights
    3. Key events and their impact on company perception
    4. Public statements from key executives and their reception
    5. Product/service launches and their market reception
    6. Company culture and leadership perception
    7. Crisis events and the company's response
    8. Public controversies or challenges
    9. Media narrative trends (positive, negative, neutral)
    
    **MANDATORY WORKFLOW:**
    1. Think carefully about your goal and make sure you cover all key focus areas.
    2. You have access to a number of tools, use these tools as required to complete your task.  Guidelines on your tools and how to use them are included in the "TOOLS" section below.
    3. Focus your research on news related to the company.
    4. Use the BraveSearchTool tool to search for real information relating to the key focus areas and related to {company_name}.
      - Search for specific queries like "{company_name} news {year}"
    5. Use the ScrapeWebsiteTool to extract detailed data from websites.
        Try scraping from well respected news and information sites
    6. If you need to look for information in a PDF or a link to a PDF, NEVER try to read the PDF content into the model, Download the PDF file using the FileDownloaderTool, and use the RagTool to find relevant content.
    7. For each focus area, conduct multiple searches with different queries to ensure comprehensive extraction - ensure you cover all relevant information and provide clear and accurate attribution and citations for all information extracted.
    8. Ensure you are completly exhaustive when extracting content, do not assume that only 1 or 2 instances of some information exists e.g. strategic priorities, or business segments etc.  Continue to search the sources until you are completly exhaustive.
    9. Find and Cross-reference information across multiple years to identify trends and changes.
    10. Prioritise information from the most recent sources.
    11. If numbers are provided in local currency, provide both the local currency and a converted value in USD - Ensure you provide the currency conversion rate used in the conversion.
    12. If you need to convert currecies you can use the Code Interpreter tool to write simple code to convert the currency from local currency to USD.
    13. Go through steps 3-12 for each key focus area and across multiple queries to ensure comprehensive extraction - ensure you cover all relevant information and provide clear and accurate attribution and citations for all information extracted.

    **FINAL OUTPUT REQUIREMENTS:**
    1. Compile results into an "News Media Analysis" aligned to the NewsMediaAnalysisResult schema in JSON format.
    2. Your analysis should:
        - Incorporate real information and data from the tools.
        - Be exhaustive and address all key focus areas.
        - Use a first-principles approach to evaluate the positioniong of the business from an internal perspective.
        - Focus on data and performance specific to the year {year}. with trends over the period: {time_period}
    3. If you cannot find information for a field, do not make it up or fabricate information, instead leave it empty or make a comment in the field explaining why you cannot find the information.
    4. Always provide clear attribution and inline citation for all information extracted from sources.

    **QUALITY REQUIREMENTS:**
    1. **NEVER FABRICATE INFORMATION**
        - only use content from your sources with clear attribution and citation.
        - if you cannot find information for a field, do not make it up or fabricate information, instead leave it empty or make a comment in the field explaining why you cannot find the information.
    2. **PROVIDE REAL WORKING URLS FOR ALL SOURCES - DO NOT PROVIDE FAKE OR MOCKED SOURCES**
    3. **NEVER GENERATE YOUR OWN PDF FILE NAME TO DOWNNLOAD - only download and use actual PDF files or documents.**
    4. **NEVER PASS A FULL PDF TO THE MODEL - use the download file tool to download the PDF and then use the search a PDF's content tool to only pass the relevant content of the PDF to the model.**
    5. **DO NOT USE TRUSTPILOT AND SIMILAR SITES FOR OPINIONS AND ANALYSIS - RATHER USE REPUTABLE SOURCES OR REPORTS**

    **TOOLS**
    You have access to these tools should you need them:
    1. BraveSearchTool: Use this tool to search the internet for real information relating to your goal.
    2. ScrapeWebsiteTool: If you need to extract specific information from a website source, use the Scrape Website tool in order to read the details of the website.
    3. Run Code - Code Interpreter tool: 
        If you need to convert currecies you can use the Code Interpreter tool to write simple code to convert the currency from local currency to USD.
        If you need to perform calculations you can use the Code Interpreter tool to write simple code to perform the calculation.
    4. FileDownloaderTool: If you need to download a file, use the FileDownloaderTool:
        Action: Download File Tool
        Action Input:
        url: 
        For each download, confirm success and extract the filename:
        "Successfully downloaded file: [filename]"
    5. RagTool: If you need to find information in a PDF use the RagTool:
        Action: Search a PDF's content tool
        Action Input:
        pdf: reference/[EXTRACTED FILENAME]
        query: [TARGETED SEARCH QUERY]
    6. IMPORTANT: If you are using URLs to download files or link to potential sources, make sure you clean any URL by removing query parameters (everything after '?' character) and fragments (everything after '#' character)
        **URL Cleaning Rules:**
          1. Remove query strings (parameters after '?' in URLs)
          2. Remove fragments (everything after '#' in URLs)
          3. Only keep the base URL path to the document
          4. Example: 
            - Original: https://www.example.com/document.pdf?view=1&lang=en#page=2
            - Cleaned: https://www.example.com/document.pdf
  expected_output: >
    A "News analysis" for {company_name} aligned to the NewsMediaAnalysisResult object containing recent (considering the cirrent date is {date}), structured information about news coverage and public perception of the company.
  agent: news_analyst




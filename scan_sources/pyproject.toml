[project]
name = "scan_sources"
version = "0.1.0"
description = "scan_sources using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "agentops>=0.4.9",
    "crewai>=0.108.0",
    "crewai-tools>=0.43.0",
    "exa-py>=1.9.1",
    "firecrawl-py>=1.15.0",
    "scrapfly-sdk>=0.8.21",
    "python-dotenv>=1.1.0",
    "pydantic>=2.11.2",
    "embedchain>=0.1.128",
    "langchain>=0.3.23",
    "langchain-openai>=0.2.14",
    "openai>=1.70.0",
    "litellm>=1.60.2",
]

[project.scripts]
kickoff = "scan_sources.main:kickoff"
plot = "scan_sources.main:plot"
kickoff_comp = "scan_sources.competitor_analysis.main:kickoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
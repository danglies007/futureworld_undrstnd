[project]
name = "foresight"
version = "0.1.0"
description = "Foresight using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "agentops>=0.4.5",
    "crewai-tools>=0.38.1",
    "crewai[tools]>=0.83.0,<1.0.0",
    "duckduckgo-search>=7.3.0",
    "firecrawl-py>=1.10.2",
    "langchain-community>=0.3.16",
    "langtrace-python-sdk>=3.5.1",
    "litellm>=1.57.4",
    "tavily-python>=0.5.0",
]

[project.scripts]
kickoff = "foresight.main:kickoff"
plot = "foresight.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

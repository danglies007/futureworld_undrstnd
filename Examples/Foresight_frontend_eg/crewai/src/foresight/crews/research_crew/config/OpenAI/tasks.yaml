trend_research_task:
  description: >
    Conduct thorough research for the section "{subtitle}" in the context of a {report_type} on {topic}.
    Goal: {high_level_goal} | Why it's important: {why_important}

    Follow this outline:
    {content_outline}

    Use sources like:
    {sources}

    Ensure findings are relevant to {sector} and useful for {audience_level}.
    Collect direct evidence (quantitative, qualitative, case studies).
    Use exact URLs and mark "INFORMATION CANNOT BE FOUND" where needed.
  expected_output: >
    - Documented trends and forces
    - Evidence with citations (with working URLs)
    - Initial impact assessment
    - Structured for use in trend analysis
  agent: trend_researcher

trend_analysis_task:
  description: >
    Analyze findings from the section "{subtitle}" in a {report_type} on {topic}.
    Goal: {high_level_goal} | Why it's important: {why_important}

    Evaluate significance and trajectory of trends for {sector}.
    Highlight primary drivers, secondary effects, and interconnections.
    Clarify areas where evidence is weak or inconclusive.
  expected_output: >
    - Ranked trend significance
    - Relationship maps
    - Clear distinction between drivers and symptoms
    - Ready for insight development
  agent: trend_analyst

insight_development_task:
  description: >
    Develop insights from the analysis for the section "{subtitle}".
    Use {why_important} and {high_level_goal} to guide relevance.

    Highlight sector-specific, cross-domain, and long-term insights.
    Use data validation where necessary, flag uncertainty transparently.
  expected_output: >
    - Clear, actionable insights
    - Reasoning and evidence
    - Strategic interpretation for {audience_level}
  agent: insights_lead

exponential_analysis_task:
  description: >
    Examine developed insights for exponential patterns in the section "{subtitle}".

    Identify acceleration factors, scenario horizons, and multi-trend interactions.
    Frame implications for {sector} and {audience_level} strategy.
  expected_output: >
    - Exponential signals and scenarios
    - Strategic impacts by time horizon
    - Intertrend amplification effects
  agent: exponential_growth_lead

content_writing_task:
  description: >
    Draft content for "{subtitle}" in a {report_type} on {topic}.

    Write clearly for {audience_level} using {content_outline} as the base.
    Maintain sourcing and accuracy with inline citations.
  expected_output: >
    - Draft content with structure, flow, and references
    - Accessible language and compelling storytelling
  agent: content_writer

content_editing_task:
  description: >
    Edit the draft for the section "{subtitle}".
    Ensure logical progression, consistency in tone, and verified data.
    Focus on readability for {audience_level}.
  expected_output: >
    - Edited version with improved clarity and coherence
    - Verified citations and valid links
  agent: content_editor

quality_review_task:
  description: >
    Final QA and implementation for "{subtitle}" section.
    Ensure alignment with {high_level_goal} and {why_important}.
    Fix all structural, data, and language issues.
  expected_output: >
    - Final content version
    - Metadata summary:
      - Word count
      - Source count
      - {sector} relevance
      - Missing info flags
  agent: quality_reviewer

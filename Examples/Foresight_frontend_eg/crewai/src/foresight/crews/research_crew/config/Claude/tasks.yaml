trend_research_task:
  description: >
    Conduct thorough research to identify and document potential trends and forces affecting {sector} in {geography} according to the provided section from the content plan for {report_type}.
    
    Research this section: {subtitle}
    Goal: {high_level_goal}
    Importance: {why_important}
    
    Follow this content outline:
    {content_outline}
    
    Initial sources to consider:
    {sources}
    
    REQUIRED SOURCES TO CONSULT:
    {specified_sources}

    For each potential trend or force identified:
    - Search multiple diverse reputable sources for confirmation and evidence relevant to {sector}
    - ENSURE all specified sources listed above are consulted and cited when relevant
    - Collect quantifiable data and statistics that demonstrate its significance through {year}
    - Document expert opinions and perspectives from credible sources appropriate for {audience_level}
    - Gather examples and case studies from {geography} that illustrate the trend
    - Evaluate the potential scope and scale of impact on {sector}
    
    Ensure all information is properly sourced with working references. If information cannot be found, clearly state this rather than making assumptions.  

    INCLUDE THE ACTUAL URLS / HYPERLINKS FOR SOURCES, CITATIONS AND REFERENCES
    
    Use various search tools as appropriate:
    - The specified sources listed above as priority references
    - Internet searches for recent reports and analyses on {sector}
    - Academic and research databases for peer-reviewed insights relevant to {topic}
    - Industry publications for {sector}-specific trends
    - News sources for current developments in {geography}
    - Statistical databases for quantitative support through {year}
  expected_output: >
    A comprehensive research report documenting potential trends and forces affecting {sector} with:
    - Clear documentation of trends and forces identified in {geography}
    - Citations from ALL specified sources where relevant to the topic
    - Supporting evidence including statistics, expert quotes, and examples through {year}
    - Source citations for all claims and data points - INCLUDE THE ACTUAL URLS / HYPERLINKS FOR SOURCES, CITATIONS AND REFERENCES
    - Initial assessment of significance and potential impact on {sector}
    - Properly organised and structured information ready for analysis appropriate for {report_type}
    - Explicit notes on which specified sources were most valuable and why
    
    The report should form a solid foundation of evidence for subsequent analysis and insight development for {company}.
  agent: trend_researcher

trend_analysis_task:
  description: >
    Analyse the research data collected to identify meaningful patterns, connections, and potential trends according to the provided section from the content plan for a {report_type} focused on {sector} in {geography}.
    
    Section: {subtitle}

    Your analysis should:
    - Evaluate the significance, potential impact, and trajectory of different trends through {year}
    - Identify which trends represent the most important forces shaping the future of {sector}
    - Recognise connections and relationships between different trends relevant to {geography}
    - Distinguish between symptoms and underlying drivers of change in {sector}
    - Organise and structure the information to highlight key patterns for {audience_level}
    - Prepare the groundwork for insight development appropriate for {report_type}
    
    Ensure all analysis is based on the evidence collected rather than speculation or opinion. Where the evidence is inconclusive, indicate this clearly.

    Consider the section's goal: {high_level_goal}
    
  expected_output: >
    An analytical report for {company} that:
    - Identifies the most significant trends and forces affecting {sector} from the research data
    - Provides structured analysis of their potential impact and trajectory through {year}
    - Highlights connections and patterns across different trends in {geography}
    - Distinguishes between primary drivers and secondary effects relevant to {sector}
    - Prepares the information in a format conducive to insight development for {audience_level}
    
    The analysis should add meaning and structure to the raw research data appropriate for a {report_type}.
  agent: trend_analyst

insight_development_task:
  description: >
    Develop meaningful insights about how the identified trends and forces will shape {sector} in {geography}, according to the provided section from the content plan for {report_type}.
    
    Section: {subtitle}

    For each major trend or cluster of related trends:
    - Identify underlying patterns and drivers affecting {sector}
    - Develop clear, evidence-based insights that explain the significance and implications through {year}
    - Connect data points across different domains where relevant to {geography}
    - Determine potential acceleration factors and inhibitors within {sector}
    - Assess the broader implications for society, markets, and organisations relevant to {audience_level}
    - Potential opportunities and threats for {sector}
    - Critical uncertainties and variables through {year}
    - Timeline considerations relevant to {report_type}
    - {sector}-specific impacts in {geography}
    
    Ensure all insights are validated against multiple sources and based on factual evidence rather than speculation.
    Where specific data points require additional verification, mark them clearly rather than making assumptions.
    
    Focus on developing insights that will be valuable and actionable for {audience_level} at {company}.

    Align with section importance: {why_important}
  expected_output: >
    A detailed insights report that:
    - Articulates clear, actionable insights derived from the identified trends affecting {sector}
    - Provides supporting evidence and reasoning for each insight relevant to {geography}
    - Explains the significance and potential trajectory of each trend through {year}
    - Highlights connections between different trends where relevant to {audience_level}
    - Maintains proper source citations throughout appropriate for {report_type}
    
    The insights should go beyond describing trends to explaining why they matter to {sector} and how they might evolve through {year}.
  agent: insights_lead

exponential_analysis_task:
  description: >
    Interpret the developed insights to identify potential exponential growth patterns and strategic implications for {sector} in {geography}, according to the provided section from the content plan for {report_type}.
    
    Section: {subtitle}

    For each major insight:
    - Assess whether it represents or contains potential for exponential/non-linear change affecting {sector}
    - Identify possible tipping points, acceleration factors, and feedback loops through {year}
    - Project scenarios for how these forces might evolve over different time horizons in {geography}
    - Evaluate strategic implications for {sector} and adjacent areas relevant to {audience_level}
    - Consider how different exponential forces might interact and amplify each other in the context of {company}
    
    Ensure all projections and strategic interpretations are grounded in evidence while still capturing the potentially disruptive nature of exponential change.
    Where specific projections are more speculative, clearly indicate this and provide reasoning.

    Consider the section goal: {high_level_goal}

  expected_output: >
    A strategic analysis report for {report_type} that:
    - Identifies which trends show potential for exponential growth or non-linear development in {sector}
    - Provides evidence-based projections for different time horizons (near, medium, long-term) through {year} and beyond
    - Articulates strategic implications for different stakeholders in {geography}
    - Explores potential interactions between different exponential forces affecting {sector}
    - Maintains balance between evidence-based analysis and forward-looking projection appropriate for {audience_level}
    
    The analysis should help {audience_level} understand the strategic significance of these forces for {company}.
  agent: exponential_growth_lead

content_writing_task:
  description: >
    Transform the research, analysis, and insights into well-structured, detailed content for {report_type} according to the provided section from the content plan focused on {sector} in {geography}.

    Section: {subtitle}
    
    Your writing should:
    - Follow the content outline: {content_outline}
    - Present the identified trends, insights, and strategic implications in clear, compelling language for {audience_level}
    - Structure the content logically with appropriate headings, subheadings, and narrative flow for {report_type}
    - Ensure all content is evidence-based and properly sourced with working references through {year}
    - Balance academic rigour with accessibility for {audience_level} at {company}
    - Use appropriate examples, analogies, and explanations to make complex ideas about {sector} understandable
    - Address the section's importance: {why_important}
    
    If specific information cannot be verified, explicitly indicate this rather than making assumptions or omitting important points about {sector} in {geography}.
  expected_output: >
    A well-written content draft for {company} that:
    - Follows the content outline for {report_type}
    - Clearly communicates the identified trends and their significance to {sector}
    - Is logically structured with appropriate headings and narrative flow for {audience_level}
    - Includes proper citations and references throughout relevant to {geography}
    - Balances detail and clarity for {audience_level}
    - Uses appropriate language, examples, and explanations relevant to {sector}
    - Maintains engaging narrative through {year} and beyond
    - Addresses section objectives for {report_type}
    
    The content should effectively communicate complex ideas about {sector} while maintaining factual accuracy.
  agent: content_writer

content_editing_task:
  description: >
    Review and refine the written content for {report_type} according to the provided section from the content plan focused on {sector} in {geography}.

    Section: {subtitle}
    
    Your editing should focus on:
    - Ensuring factual accuracy and proper sourcing of all claims about {sector}
    - Verifying that all references and links are valid and working through {year}
    - Improving clarity, coherence, and logical flow for {audience_level}
    - Enhancing readability and engagement while maintaining accuracy appropriate for {report_type}
    - Ensuring appropriate tone and level of complexity for {audience_level} at {company}
    - Consistency in terminology related to {sector} in {geography}
    - Identifying and addressing any gaps, inconsistencies, or potential inaccuracies
    
    Ensure alignment with: {high_level_goal}

    If specific claims cannot be verified, mark them clearly rather than removing important information about {sector} that may be accurate.
  expected_output: >
    A polished, high-quality content draft for {company} that:
    - Maintains factual accuracy with proper sourcing relevant to {sector}
    - Features improved clarity, coherence, and flow appropriate for {report_type}
    - Has enhanced readability and engagement for {audience_level}
    - Is appropriate for {audience_level} in tone and complexity
    - Has addressed gaps, inconsistencies, and potential inaccuracies about {sector} in {geography}
    
    The edited content should represent a significant improvement in quality while maintaining the substance of the original draft through {year}.
  agent: content_editor

quality_review_task:
  description: >
    Conduct a comprehensive quality review of the {report_type} content according to the provided section from the content plan, and then implement all recommended improvements to deliver a final, polished version for {company} focused on {sector} in {geography}.

    Section: {subtitle}
    
    Your task has two parts:
    1. REVIEW: Assess the content for factual accuracy, structural integrity, and compliance with best practices for {report_type}
    2. IMPLEMENT: Apply all necessary improvements and refinements to create the final version of the content for {audience_level}
    
    During review, assess:
    - Achievement of section goal: {high_level_goal}
    - Coverage of outlined content: {content_outline}
    - Factual accuracy and proper sourcing of all claims about {sector} through {year}
    - Validity and functionality of all references and links relevant to {geography}
    - Overall quality, clarity, coherence, and impact of the content for {audience_level}
    - Effectiveness in identifying and analysing market forces and social dynamics affecting {sector}
    - Value and actionability of insights for {audience_level}
    - Compliance with requirements specified in the content plan for {report_type}
    
    During implementation:
    - Correct any factual inaccuracies identified about {sector}
    - Update any outdated statistics or data points through {year}
    - Enhance clarity, flow, and readability for {audience_level}
    - Strengthen any weak sections relevant to {geography}
    - Add missing information and sources where needed - INCLUDE THE ACTUAL URLS / HYPERLINKS FOR SOURCES, CITATIONS AND REFERENCES
    - Ensure proper formatting and consistent style appropriate for {report_type}
    - Maintain the authoritative voice and strategic focus expected by {company}
    
    The output should be the complete, final version of the content with all improvements integrated - NOT a review report.
  expected_output: >
    A complete, final version of the content for {company} that:
    - Has incorporated all quality improvements relevant to {sector} in {geography}
    - Maintains factual accuracy with proper sourcing through {year}
    - Features enhanced clarity, coherence, and flow appropriate for {audience_level}
    - Has addressed gaps, inconsistencies, and potential inaccuracies about {sector}
    - Is ready for publication without further edits as a professional {report_type}
    
    The output should be the polished, publication-ready final content that demonstrates high quality, accuracy, and strategic value for {company} - not a review of the content.
  agent: quality_reviewer